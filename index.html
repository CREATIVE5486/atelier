<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier">
<meta name="theme-color" content="#18293A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F2; --panel:#FFFFFF; --ink:#18293A; --muted:#5D6B78; --line:#CDD5DC;
  --accent:#E39B12; --accent-ink:#2A1A00; --ok:#2E7D6B; --alert:#C2412D; --chip:#E2E8EC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A24; --panel:#172532; --ink:#E4EBF0; --muted:#93A3B1; --line:#2A3B4B;
  --accent:#F0AE2E; --accent-ink:#2A1A00; --ok:#4FB39A; --alert:#E36A55; --chip:#223443;
}}
:root[data-theme="dark"]{
  --bg:#0F1A24; --panel:#172532; --ink:#E4EBF0; --muted:#93A3B1; --line:#2A3B4B;
  --accent:#F0AE2E; --accent-ink:#2A1A00; --ok:#4FB39A; --alert:#E36A55; --chip:#223443;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;font-weight:700;margin:0;line-height:1.1}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.15rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--nav);color:#EDF0F2;padding:1.25rem .75rem;display:flex;flex-direction:column;gap:.25rem}
nav.side .brand{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:700;padding:0 .5rem 1rem}
nav button.tab{background:none;border:0;text-align:left;padding:.6rem .75rem;border-radius:6px;color:inherit;opacity:.75;font-weight:500}
nav button.tab[aria-current="page"]{opacity:1;background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--accent)}
.sync{margin-top:auto;font-size:.8rem;opacity:.7;padding:.5rem}
.sync b{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--muted);margin-right:.4rem}
.sync.on b{background:var(--ok)} .sync.off b{background:var(--alert)}

main{padding:1.5rem clamp(1rem,3vw,2.5rem) 6rem;max-width:1100px;width:100%;min-width:0}
main a{color:var(--ink);text-underline-offset:2px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
.btn{border:0;border-radius:6px;padding:.55rem 1rem;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--alert);border:1px solid var(--alert)}
.btn.sm{padding:.3rem .65rem;font-size:.9rem}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:1.5rem}
.kpi{background:var(--panel);padding:1rem}
.kpi strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:2rem;line-height:1}
.kpi span{color:var(--muted);font-size:.9rem}
.kpi.warn strong{color:var(--alert)}

section.block{margin-bottom:1.75rem}
section.block > h2{margin-bottom:.6rem}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.row{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.click{cursor:pointer} .row.click:hover{background:var(--chip)}
.row .grow{flex:1;min-width:0}
.row .sub{color:var(--muted);font-size:.88rem}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:.78rem;font-weight:600;padding:.12rem .5rem;border-radius:99px;background:var(--chip);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.alert{background:color-mix(in srgb,var(--alert) 18%,transparent);color:var(--alert)}
.pill.acc{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.bar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;background:var(--ok)}
.empty{padding:1.5rem 1rem;color:var(--muted)}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.75rem}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:.25rem .8rem;font-size:.9rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qty{display:flex;align-items:center;gap:.25rem}
.lock{display:inline-flex;align-items:center;gap:.4rem}
.lock.open{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.qty button:disabled{opacity:.3;cursor:not-allowed}
.qty button{width:2rem;height:2rem;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-weight:600}

dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.55)}
.dlg{padding:1.25rem;display:flex;flex-direction:column;gap:.85rem;overflow:auto;max-height:90vh}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.88rem;color:var(--muted);font-weight:500}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;background:var(--bg);font-size:1rem;width:100%}
textarea{min-height:4.5rem;resize:vertical}
input[type=checkbox]{width:1.2rem;height:1.2rem;flex:none;padding:0}
.actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.actions .spacer{flex:1}
.bomline,.task{display:flex;gap:.5rem;align-items:center}
.bomline select{flex:1}.bomline input{width:5.5rem}
.poignee{border:0;background:none;color:var(--muted);padding:.35rem .25rem;cursor:grab;touch-action:none;display:flex;align-items:center;border-radius:4px}.poignee:active{cursor:grabbing}.task.glisse{background:var(--chip);border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;z-index:1}
.task input[type=text]{flex:1}.task input[type=checkbox]{width:1.2rem;height:1.2rem}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;padding:0 .3rem}
.toast{position:fixed;left:50%;bottom:calc(5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.toast{width:max-content;max-width:92vw}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:1rem}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:.2rem .3rem;text-decoration:underline}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;padding:.35rem .25rem calc(.35rem + env(safe-area-inset-bottom,0px));z-index:5;gap:0}
  nav.side .brand,.sync{display:none}
  nav button.tab{flex:1;text-align:center;font-size:.8rem;padding:.55rem .1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav button.tab[aria-current="page"]{box-shadow:inset 0 3px 0 var(--accent)}
  h1{font-size:1.7rem}
  .grid2{grid-template-columns:1fr}
  .mob-sync{display:block}
}
nav.side[hidden]{display:none!important}.app:has(nav.side[hidden]){grid-template-columns:1fr}
.mob-sync{display:none;font-size:.8rem;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.4rem}
.gal button{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;background:var(--chip)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .vid{position:absolute;right:.3rem;bottom:.3rem;background:rgba(0,0,0,.65);color:#fff;font-size:.72rem;padding:.05rem .35rem;border-radius:4px}
.gal .ph{display:flex;align-items:center;justify-content:center;height:100%;font-size:.75rem;color:var(--muted);padding:.3rem;text-align:center;word-break:break-all}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0}
#viewer{width:min(960px,96vw)} #viewer img,#viewer video{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:6px;background:#000}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.ref{border-collapse:collapse;width:100%;font-size:.92rem}
table.ref th,table.ref td{padding:.5rem .65rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.ref th{background:var(--chip);font-weight:600;white-space:nowrap}
table.ref tr:last-child td{border-bottom:0}
table.ref td:first-child{white-space:nowrap}
table.ref td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.refcard{margin-bottom:1.5rem}
.refcard .meta{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;margin-bottom:.4rem;flex-wrap:wrap}
.refcard p{margin:.4rem 0 0;color:var(--muted);font-size:.9rem;max-width:70ch}
.grid-ed{overflow-x:auto}
.grid-ed table{border-collapse:collapse}
.grid-ed td{padding:2px}
.grid-ed input{min-width:7.5rem;padding:.35rem .45rem;font-size:.92rem}
.grid-ed thead input{font-weight:600;background:var(--chip)}
.search{margin-bottom:1rem}
.back{background:none;border:0;padding:.2rem 0;color:var(--muted);font-weight:600;margin-bottom:.5rem}
.back:hover{color:var(--ink)}
.grp{margin:0 0 .4rem;font-size:1rem;color:var(--muted);font-family:Barlow,sans-serif;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:1.25rem}
.seg button{border:0;background:var(--panel);padding:.5rem 1.1rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.9rem;margin-bottom:1.75rem}
.sp{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.sp .ph{aspect-ratio:16/10;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;cursor:pointer;border:0;padding:0;width:100%}
.sp .ph img,.spd .ph img{width:100%;height:100%;object-fit:cover;display:block}
.sp .bd{padding:.7rem .8rem .85rem;display:flex;flex-direction:column;gap:.35rem}
.sp h3{cursor:pointer}
.sci{font-style:italic;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:.12rem .55rem;font-size:.82rem}
.chips button:hover{border-color:var(--ink)}
.lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.spd .ph{aspect-ratio:16/9;background:var(--chip);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.spd dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;margin:0}
.spd dt{color:var(--muted);font-size:.88rem;font-weight:600}.spd dd{margin:0}

:root{--nav:#18293A;--good:#0ca30c;--warn:#b07a00;--crit:#d03b3b;--track:#dfe5ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nav:#0a1219;--good:#3fbf3f;--warn:#fab219;--crit:#ef6b6b;--track:#22313f}}
:root[data-theme="dark"]{--nav:#0a1219;--good:#3fbf3f;--warn:#fab219;--crit:#ef6b6b;--track:#22313f}
main{max-width:1280px}
.stock-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.stock-pan{position:sticky;top:1rem}
.seg-mob{display:none}
@media (max-width:980px){.stock-grid{grid-template-columns:1fr}.seg-mob{display:inline-flex}.vue-liste .stock-pan{display:none}.vue-visuel .stock-liste{display:none}.stock-pan{position:static}}
.pan{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem;display:flex;flex-direction:column;gap:1.25rem}
.pan h3{font-size:1.05rem}
p.sub{color:var(--muted);font-size:.88rem}
.pan-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.pan-kpi div{display:flex;flex-direction:column}
.pan-kpi strong{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;line-height:1.1;color:var(--ink)}
.pan-kpi span{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.25rem}
.st-ok{color:var(--good)}.st-warn{color:var(--warn)}.st-crit{color:var(--crit)}
.pan-kpi .st-crit span svg{color:var(--crit)}.pan-kpi .st-warn span svg{color:var(--warn)}
.pan-kpi .st-crit span,.pan-kpi .st-warn span{color:var(--muted)}
.bobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.6rem}
.bob{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.6rem .4rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;text-align:center}
.bob:hover{border-color:var(--ink)}
.bob-r{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c) var(--p),var(--track) 0);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.bob-in{width:44px;height:44px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;line-height:1;box-shadow:0 0 0 1px var(--line)}
.bob-in small{font-family:Barlow,sans-serif;font-weight:500;font-size:.62rem;color:var(--muted)}
.bob-n{font-size:.82rem;font-weight:600;line-height:1.15}
.bob-q{font-size:.75rem;color:var(--muted)}
.bob-s{font-size:.72rem;display:flex;align-items:center;gap:.2rem}
.jg{padding:.45rem 0;border-top:1px solid var(--line)}
.jg:first-of-type{border-top:0}
.jg-h{display:flex;justify-content:space-between;gap:.5rem;font-size:.88rem}
.jg-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-t{position:relative;height:8px;background:var(--track);border-radius:4px;margin:.3rem 0 .2rem}
.jg-t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;min-width:3px}
.jg-t i.s-ok{background:var(--good)}.jg-t i.s-warn{background:var(--warn)}.jg-t i.s-crit{background:var(--crit)}
.jg-t b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);transform:translateX(-1px);border-radius:1px}
.jg-f{font-size:.75rem;display:flex;align-items:center;gap:.3rem}
.jg-f .sub{margin-left:auto;font-size:.72rem}
.vc{display:grid;grid-template-columns:6.5rem 1fr auto;gap:.5rem;align-items:center;font-size:.85rem;padding:.2rem 0}
.vc-t{height:10px;background:var(--track);border-radius:4px;overflow:hidden}
.vc-t i{display:block;height:100%;background:var(--ink);opacity:.75;border-radius:4px}
.bandeau{display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:8px;padding:.7rem 1rem;margin-bottom:1.25rem}
.bandeau svg{color:var(--warn);vertical-align:-1px}
.bloc{border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem}
.bloc summary{cursor:pointer;font-weight:600}
.bloc-in{border-top:1px solid var(--line);padding-top:.8rem}
.mv,.essai{display:grid;grid-template-columns:4.6rem 1fr auto auto;gap:.6rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line);font-size:.9rem}
.mv:first-child{border-top:0}
.mv-d{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.mv-n{min-width:0}.mv-n small{display:block;color:var(--muted);font-size:.78rem}
.mv-q{white-space:nowrap;font-weight:600}.mv-c{white-space:nowrap;color:var(--muted);font-size:.85rem;text-align:right}
.bloc-in .mv{grid-template-columns:1fr auto}
.essai{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;grid-template-columns:4.6rem 1fr auto;color:var(--ink)}
.essai:hover{background:var(--chip)}
.lien{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}.lien input{flex:1 1 8rem;min-width:0}
nav .tab .ct{display:none}
@media (max-width:760px){nav .tab .lg{display:none}nav .tab .ct{display:inline}nav button.tab{font-size:.78rem}}
table.couts tr.click{cursor:pointer}table.couts tr.click:hover td{background:var(--chip)}
table.couts td.n svg{vertical-align:-1px}
.recap{border:1px solid var(--line);border-radius:8px;padding:.3rem .8rem;background:var(--bg)}
.recap .mv{grid-template-columns:1fr auto}
.mv-c.st-crit,.mv-q.st-crit,.sub.st-crit{color:var(--crit)}.mv-c.st-ok,.mv-q.st-ok{color:var(--good)}
.viz{--s1:#2a78d6;--s2:#eb6834;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.8rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .viz{--s1:#3987e5;--s2:#d95926}}
:root[data-theme="dark"] .viz{--s1:#3987e5;--s2:#d95926}
.viz .b1{fill:var(--s1)}.viz .b2{fill:var(--s2)}.viz .gl{stroke:var(--line);stroke-width:1}.viz .base{stroke:var(--muted);stroke-width:1}
.viz .ax{fill:var(--muted);font-size:11px;font-family:Barlow,sans-serif}
.lgd{display:flex;gap:1rem;font-size:.85rem;margin-bottom:.3rem}.lgd i{display:inline-block;width:.75rem;height:.75rem;border-radius:2px;margin-right:.35rem;vertical-align:-1px;background:var(--s1)}.lgd i.b2{background:var(--s2)}
.viz path:hover{opacity:.8}
.pw{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:.5rem;margin-top:.3rem}
.pw label{font-weight:600;color:var(--ink)}.pw small{color:var(--muted);font-weight:400;font-size:.72rem}
.pts{display:inline-flex;gap:3px}.pts i{width:9px;height:9px;border-radius:50%;background:var(--track);display:inline-block}.pts i.on{background:var(--ink)}
.fil-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin:1.25rem 0}
.fil{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.fil dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem .8rem;margin:0;font-size:.9rem}.fil dt{color:var(--muted);font-weight:600}.fil dd{margin:0}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;font-size:.88rem}.pm ul{margin:.3rem 0 0;padding-left:1.1rem}.pm li{margin-bottom:.2rem}
@media (max-width:520px){.pm{grid-template-columns:1fr}}
.kpis.kpis3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.6rem,1fr));width:100%}.seg button{white-space:normal;line-height:1.15;padding:.5rem .35rem}}
.ct-but{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem}.ct-but input{font-size:1.05rem;background:var(--panel)}
.ct-bilan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin-bottom:.4rem}.ct-bilan div{display:flex;flex-direction:column}.ct-bilan strong{font-family:"Barlow Condensed",sans-serif;font-size:1.7rem;line-height:1}.ct-bilan span{font-size:.8rem;color:var(--muted)}

<body>
<div class="app">
  <nav class="side" aria-label="Sections">
    <div class="brand">Atelier</div>
    <button class="tab" data-view="accueil">Accueil</button>
    <button class="tab" data-view="projets">Projets</button>
    <button class="tab" data-view="stock">Stock</button>
    <button class="tab" data-view="ventes">Ventes</button>
    <button class="tab" data-view="comptes">Comptes</button>
    <button class="tab" data-view="refs"><span class="lg">Références</span><span class="ct">Réf.</span></button>
    <div class="sync" id="sync"><b></b><span>Connexion…</span></div>
  </nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<dialog id="viewer"><div class="dlg" id="viewerBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="especes.js"></script>
<script src="filaments.js"></script>
<script>
/* ---------- Données ---------- */
const COLS=["projets","articles","leurres","refs","fabrications","photos","mouvements","essais","reglages","ventes","sorties","lots","factures","inventaires","depenses"];
const S=Object.fromEntries(COLS.map(c=>[c,[]]));
let view="accueil", filtre="tous", store=null, refSel=null;

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>(Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const $=s=>document.querySelector(s);

/* Synchro Firebase (Firestore), privée par utilisateur */
let F=null, unsubs=[];
function cloudStore(uidv){
  const col=c=>F.collection(F.db,"users",uidv,c);
  return{
    listen(c,cb,err){const q=c==="mouvements"&&F.query?F.query(col(c),F.orderBy("date","desc"),F.limit(1500)):col(c);return F.onSnapshot(q,s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),err)},
    async batch(ops){const b=F.writeBatch(F.db);const J=x=>JSON.parse(JSON.stringify(x));ops.forEach(o=>{const r=this.ref(o.c,o.id);if(o.op==="inc")b.update(r,{qte:F.increment(o.d)});else if(o.op==="incf")b.update(r,{[o.f]:F.increment(o.d)});else if(o.op==="set")b.set(r,J(o.data));else if(o.op==="upd")b.update(r,J(o.f));else if(o.op==="del")b.delete(r)});await b.commit()},
    ref:(c,id)=>F.doc(F.db,"users",uidv,c,id),
    async save(c,o){const {id,...b}=o;await F.setDoc(this.ref(c,id),JSON.parse(JSON.stringify(b)))},
    async update(c,id,f){await F.updateDoc(this.ref(c,id),JSON.parse(JSON.stringify(f)))},
    async inc(c,id,d){await F.updateDoc(this.ref(c,id),{qte:F.increment(d)})},
    async batchInc(c,list){const b=F.writeBatch(F.db);list.forEach(([id,d])=>b.update(this.ref(c,id),{qte:F.increment(d)}));await b.commit()},
    async fabriquer(deltas,fab){const b=F.writeBatch(F.db);deltas.forEach(([id,d])=>b.update(this.ref("articles",id),{qte:F.increment(d)}));const {id,...data}=fab;b.set(this.ref("fabrications",id),JSON.parse(JSON.stringify(data)));await b.commit()},
    async annulerFab(deltas,fabId){const b=F.writeBatch(F.db);deltas.forEach(([id,d])=>b.update(this.ref("articles",id),{qte:F.increment(d)}));b.delete(this.ref("fabrications",fabId));await b.commit()},
    async addMedia(c,id,m){await F.updateDoc(this.ref(c,id),{medias:F.arrayUnion(m)})},
    async removeMedia(c,id,m){await F.updateDoc(this.ref(c,id),{medias:F.arrayRemove(m)})},
    async remove(c,id){await F.deleteDoc(this.ref(c,id))}
  };
}
function setSync(state,txt){const el=$("#sync");el.className="sync "+state;el.querySelector("span").textContent=txt;
  const m=$("#mobSync");if(m)m.textContent=txt}
function majReseau(){navigator.onLine?setSync("on","Synchronisé"):setSync("off","Pas de réseau")}
addEventListener("online",majReseau);addEventListener("offline",majReseau);

function boot(f){
  F=f;
  if(!F||!F.ok){view=F&&F.err?"erreur":"config";render();return}
  F.onAuthStateChanged(F.auth,u=>{
    unsubs.forEach(x=>x());unsubs=[];
    if(!u){view="login";COLS.forEach(c=>S[c]=[]);render();return}
    if(["login","chargement"].includes(view))view="accueil";
    store=cloudStore(u.uid);majReseau();
    const charge=new Set();migrOK=false;COLS.forEach(c=>unsubs.push(store.listen(c,rows=>{S[c]=rows;charge.add(c);if(charge.size===COLS.length&&navigator.onLine)migrerLots();render()},e=>setSync("off","Erreur de synchro ("+e.code+")"))));
    render();
  });
}
function init(){view="chargement";render();
  const go=()=>{boot(window.FB);OD.init(window.MS_CLIENT_ID)};
  if(window.FB)go();else addEventListener("fb-ready",go,{once:true});
  setTimeout(()=>{if(!F){view="erreur";render()}},12000);
}
async function save(c,o){try{await store.save(c,o)}catch(e){toast("Échec de l'enregistrement : "+(e.code||"erreur"))}}
async function remove(c,id){try{await store.remove(c,id)}catch(e){toast("Échec de la suppression")}}
async function upd(c,id,f){try{await store.update(c,id,f)}catch(e){toast("Échec de l'enregistrement : "+(e.code||"erreur"))}}

async function login(){
  $("#l_err").textContent="";
  try{await F.signInWithEmailAndPassword(F.auth,$("#l_mail").value.trim(),$("#l_pw").value)}
  catch(e){$("#l_err").textContent=["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(e.code)?"Email ou mot de passe incorrect.":"Connexion impossible ("+e.code+")."}
}
function logout(){if(confirm("Se déconnecter ?"))F.signOut(F.auth)}
function exporter(){
  const blob=new Blob([JSON.stringify({exporte:new Date().toISOString(),...S},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="atelier-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();toast("Sauvegarde téléchargée");
  majReglages({dernierExport:new Date().toISOString()});
}
const DEF_REG={purgeG:2,stlPart:50,debitGh:25,kwh:0.2001,watts:175,usure:0.05,tauxHoraire:12.31,emballage:0.8,margeVisee:30,urssaf:12.4,
  canaux:[{nom:"Main propre",pct:0,fixe:0},{nom:"Leboncoin",pct:0,fixe:0},{nom:"Vinted",pct:0,fixe:0},{nom:"Etsy",pct:11.64,fixe:0.48},{nom:"Site perso",pct:0,fixe:0},{nom:"Salon / marché",pct:0,fixe:0}]};
const REG=()=>{const r=S.reglages.find(x=>x.id==="general")||{};return{...DEF_REG,...Object.fromEntries(Object.entries(r).filter(([k,v])=>v!==null&&v!==undefined))}};
async function majReglages(f){const brut=S.reglages.find(x=>x.id==="general")||{};try{await store.save("reglages",{...brut,...f,id:"general"})}catch(e){}}
function bandeauExport(){
  const d=REG().dernierExport,j=d?Math.floor((Date.now()-new Date(d))/864e5):null;
  if(j!==null&&j<30)return"";
  const vide=!S.articles.length&&!S.leurres.length&&!S.projets.length;if(vide)return"";
  return`<div class="bandeau"><span>${ICO_NIV.warn} ${j===null?"Tu n'as encore jamais exporté tes données.":`Dernier export il y a ${j} jours.`} Une sauvegarde par mois te protège d'une suppression par erreur.</span><button class="btn sm" onclick="exporter()">Exporter maintenant</button></div>`;
}

/* ---------- Calculs ---------- */
const CATCFG={
  "Filament":{unites:["g"],lot:1000,lotNom:"bobine",lotsNom:"bobines",fem:1},
  "Résine":{unites:["ml","g"],lot:1000,lotNom:"kit",lotsNom:"kits"},
  "Quincaillerie":{unites:["pcs","cm","m","g"],lot:10,lotNom:"sachet",lotsNom:"sachets"},
  "Hameçons":{unites:["pcs"],lot:10,lotNom:"sachet",lotsNom:"sachets"},
  "Peinture":{unites:["ml","g"],lot:30,lotNom:"flacon",lotsNom:"flacons"},
  "Bavettes":{unites:["pcs","cm²"],lot:1,lotNom:"plaque",lotsNom:"plaques",fem:1},
  "Outillage":{unites:["pcs"],lot:1,lotNom:"pièce",lotsNom:"pièces",fem:1},
  "Autre":{unites:["pcs","g","ml","cm","m"],lot:1,lotNom:"lot",lotsNom:"lots"}
};
const CATS=Object.keys(CATCFG);
const FIL=window.FILAMENTS_DATA||[];const filById=m=>FIL.find(f=>f.id===m);
const FILAMENTS=FIL.length?FIL.map(f=>f.id):["PLA","PETG","ABS","ASA","TPU"];
const MATIERES_CORPS=["ASA","PETG","PLA","ABS","PC","TPU","PA-CF","Résine","Bois","Autre"];
const cfg=a=>CATCFG[a?.categorie]||CATCFG.Autre;
const fmt=(n,d=2)=>(Number(n)||0).toLocaleString("fr-FR",{maximumFractionDigits:d});
const art=id=>S.articles.find(a=>a.id===id);
const lotQ=a=>Number(a?.lotQte)>0?Number(a.lotQte):cfg(a).lot;
const pu=a=>!a?0:(Number(a.prixLot)>0&&lotQ(a)>0?Number(a.prixLot)/lotQ(a):(Number(a.prix)||0));
const nomArt=a=>a?(a.nom||[a.matiere,a.couleur].filter(Boolean).join(" ")||"Sans nom"):"Article supprimé";
const enLots=a=>{const n=(Number(a.qte)||0)/lotQ(a),c=cfg(a);return fmt(n)+" "+(n>1?c.lotsNom:c.lotNom)};
const coutMat=l=>(l.bom||[]).reduce((s,b)=>s+coutFifo(b.articleId,pnum(b.qte)),0)+coutPurge(l);
const coutPurge=l=>{const f=filsDe(l)[0];return f?coutFifo(f.articleId,(Number(REG().purgeG)||0)/Math.max(1,Math.round(pnum(l.parPlateau))||1)):0};
const matiereImp=l=>{const b=(l.bom||[]).map(x=>art(x.articleId)).find(a=>a?.categorie==="Filament");return b?.matiere||(FILAMENTS.includes(l.corps)?l.corps:"")};
const wattsMat=m=>{const r=REG();return Number(r.wattsMat?.[m])||filById(m)?.watts||r.watts};
const coutImp=l=>{const h=pnum(l.impH),r=REG();if(!(h>0))return 0;return h*(wattsMat(matiereImp(l))/1000)*r.kwh+h*r.usure};
const coutMO=l=>pnum(l.moH)*(REG().tauxHoraire??0);
const coutEmb=()=>REG().emballage??0;
const coutLeurre=l=>coutMat(l)+coutImp(l)+coutMO(l)+coutEmb();
const CANAUX_DEF=[{nom:"Main propre",pct:0,fixe:0},{nom:"Leboncoin",pct:0,fixe:0},{nom:"Vinted",pct:0,fixe:0},{nom:"Etsy",pct:0,fixe:0},{nom:"Site perso",pct:0,fixe:0},{nom:"Salon / marché",pct:0,fixe:0}];
const canaux=()=>REG().canaux?.length?REG().canaux:DEF_REG.canaux;
const canal=n=>canaux().find(c=>c.nom===n)||{nom:n,pct:0,fixe:0};
function couts(l,canalNom){
  const r=REG(),mat=coutMat(l),imp=coutImp(l),mo=coutMO(l),emb=coutEmb(),total=mat+imp+mo+emb;
  const urs=(r.urssaf??0)/100,mv=(r.margeVisee??30)/100,c=canal(canalNom||"Main propre");
  const pv=Number(l.prixVente)||0;
  const frais=p=>p*(c.pct/100)+c.fixe+p*urs;
  const margeMP=pv?pv-frais(pv)-total:0;
  const den=1-c.pct/100-urs-mv,conseille=den>0?(total+c.fixe)/den:0;
  return{mat,imp,mo,emb,total,margeMP,tauxMP:pv?margeMP/pv*100:0,conseille:Math.ceil(conseille*2)/2,frais:pv?frais(pv):0}
}
const fabTot=id=>S.fabrications.filter(f=>f.leurreId===id).reduce((s,f)=>s+(Number(f.n)||0),0);
const venduTot=id=>S.ventes.filter(v=>v.leurreId===id).reduce((s,v)=>s+(Number(v.qte)||0),0);
const sortiTot=id=>S.sorties.filter(x=>x.leurreId===id).reduce((s,x)=>s+(Number(x.n)||0),0);
const dispo=id=>fabTot(id)-venduTot(id)-sortiTot(id);
const coutUnitFab=l=>coutLeurre(l);
const stockBas=()=>S.articles.filter(a=>Number(a.seuil)>0&&Number(a.qte)<=Number(a.seuil));
const fabricables=l=>{const r=(l.bom||[]).filter(b=>Number(b.qte)>0).map(b=>Math.floor((Number(art(b.articleId)?.qte)||0)/Number(b.qte)));return r.length?Math.min(...r):0};
const dot=a=>a?.teinte?`<span aria-hidden="true" style="display:inline-block;width:.8rem;height:.8rem;border-radius:50%;background:${esc(a.teinte)};border:1px solid var(--line);vertical-align:-1px;margin-right:.35rem"></span>`:"";
const avancement=p=>{const t=p.taches||[];return t.length?Math.round(100*t.filter(x=>x.fait).length/t.length):0};

/* ---------- Rendu ---------- */
function render(force){
  if(view==="leurres"){view="projets";filtre="Leurres"}
  if(!force&&view==="conception"){const a=document.activeElement;if(a&&$("#main").contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){renderAttente=true;return}}
  document.querySelectorAll("nav .tab").forEach(b=>b.setAttribute("aria-current",b.dataset.view===(["conception","leurres"].includes(view)?"projets":view)?"page":"false"));
  document.querySelector("nav.side").hidden=["login","config","erreur","chargement"].includes(view);

/* ---------- Lots matière : chaque achat garde son prix, consommation des plus anciens d'abord ---------- */
const r2=x=>Math.round((Number(x)||0)*100)/100,r3=x=>Math.round((Number(x)||0)*1000)/1000;
const ORIG_LOT={achat:"",initial:"stock existant",ajustement:"ajustement",retour:"remis en stock",inventaire:"inventaire",facture:""};
const lotsDe=aid=>S.lots.filter(x=>x.articleId===aid&&Number(x.reste)>1e-9).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.id<b.id?-1:1));
function fifo(aid,q,pref){const a=art(aid);let r=Math.max(0,Number(q)||0);const parts=[];let cost=0;let LL=lotsDe(aid);
  if(pref){const i=LL.findIndex(l=>l.id===pref);if(i>0)LL=[LL[i],...LL.slice(0,i),...LL.slice(i+1)]}
  for(const l of LL){if(r<=1e-9)break;const t=Math.min(r,Number(l.reste)),p=Number(l.pu)||0;parts.push({lotId:l.id,q:t,pu:p});cost+=t*p;r-=t}
  if(r>1e-9){const p=pu(a);parts.push({lotId:"",q:r,pu:p});cost+=r*p}
  return{parts,cost}}
const valeurArt=a=>fifo(a.id,Math.max(0,Number(a.qte)||0)).cost;
const puMoy=a=>Number(a.qte)>0?valeurArt(a)/Number(a.qte):pu(a);
const coutFifo=(aid,q)=>art(aid)?fifo(aid,q).cost:0;
function opsEntree(a,q,puU,x={}){const lid=x.lotId||uid();puU=Number(puU)||0;
  const m=mvt(a,q,x.motif||"achat",{cout:x.cout??(puU>0?r2(q*puU):null),projetId:x.projetId,ref:x.ref||lid});m.data.lots=[{lotId:lid,q:r3(q),pu:puU}];
  const lot={op:"set",c:"lots",id:lid,data:{articleId:a.id,nom:nomArt(a),date:x.date||new Date().toISOString(),qte0:r3(q),reste:r3(q),pu:puU,prixTot:r2(x.cout??q*puU),fournisseur:x.fournisseur??(a.fournisseur||""),facture:x.facture||"",factureId:x.factureId||"",origine:x.origine||"achat",note:x.note||""}};
  return{ops:[lot,{op:"inc",c:"articles",id:a.id,d:r3(q)},m],undo:[{op:"del",c:"lots",id:lid},{op:"inc",c:"articles",id:a.id,d:-r3(q)},{op:"del",c:"mouvements",id:m.id}],mvtId:m.id,lotId:lid}}
function opsSortie(a,q,motif,x={}){const f=fifo(a.id,q,x.lotId),m=mvt(a,-q,motif,{cout:r2(f.cost),projetId:x.projetId,ref:x.ref});m.data.lots=f.parts.map(p=>({...p,q:r3(p.q)}));
  const ops=[{op:"inc",c:"articles",id:a.id,d:-r3(q)},...f.parts.filter(p=>p.lotId).map(p=>({op:"incf",c:"lots",id:p.lotId,f:"reste",d:-r3(p.q)})),m];
  return{ops,undo:[...opsRetour(a,f.parts),{op:"del",c:"mouvements",id:m.id}],cost:f.cost,parts:f.parts.map(p=>({...p,q:r3(p.q)})),mvtId:m.id}}
function opsRetour(a,parts){const ops=[];let tot=0;
  (parts||[]).forEach(p=>{const q=Number(p.q)||0;if(!(q>0))return;tot+=q;
    if(p.lotId&&S.lots.some(l=>l.id===p.lotId))ops.push({op:"incf",c:"lots",id:p.lotId,f:"reste",d:r3(q)});
    else{const pp=Number(p.pu)||pu(a);ops.push({op:"set",c:"lots",id:uid(),data:{articleId:a.id,nom:nomArt(a),date:new Date().toISOString(),qte0:r3(q),reste:r3(q),pu:pp,prixTot:r2(q*pp),fournisseur:"",facture:"",origine:"retour",note:""}})}});
  if(tot)ops.push({op:"inc",c:"articles",id:a.id,d:r3(tot)});return ops}
async function lots_batch(ops){for(let i=0;i<ops.length;i+=450)await store.batch(ops.slice(i,i+450))}
let migrOK=false;
async function migrerLots(){if(migrOK||!store)return;migrOK=true;
  const ops=S.articles.filter(a=>Number(a.qte)>0&&!S.lots.some(l=>l.articleId===a.id)).map(a=>({op:"set",c:"lots",id:"init_"+a.id,data:{articleId:a.id,nom:nomArt(a),date:"2000-01-01T00:00:00.000Z",qte0:r3(a.qte),reste:r3(a.qte),pu:pu(a),prixTot:r2(Number(a.qte)*pu(a)),fournisseur:a.fournisseur||"",facture:"",origine:"initial",note:""}}));
  if(ops.length)try{await lots_batch(ops)}catch(e){migrOK=false}}
function blocLots(a){const L=S.lots.filter(l=>l.articleId===a.id).sort((x,y)=>(y.date||"").localeCompare(x.date||""));const act=L.filter(l=>Number(l.reste)>1e-9),fin=L.filter(l=>!(Number(l.reste)>1e-9));
  return`<details class="bloc" open><summary>Lots en stock (${act.length}) · valeur ${eur(valeurArt(a))}</summary><div style="margin-top:.4rem">${act.length?act.map(l=>ligneLot(a,l)).join(""):`<p class="sub">Aucun lot en stock.</p>`}

function calcProd(){const P=prodTmp,R=REG(),ratee=P.ratee,k0=ratee?Math.min(100,Math.max(0,pnum(P.pct)))/100:1;
  const lig=P.lignes.map((x,i)=>{const l=S.leurres.find(y=>y.id===x.leurreId),n=Math.max(0,Math.round(pnum(x.n))),b=ratee?0:Math.min(n,Math.max(0,Math.round(pnum(x.bonnes))));
    return{i,x,l,n,b,theoG:filsDe(l).reduce((s,f)=>s+pnum(f.qte)*n,0),theoH:pnum(l?.impH)*n}}).filter(z=>z.l&&z.n>0);
  const theoG=lig.reduce((s,z)=>s+z.theoG,0),G=pnum(P.g)>0?pnum(P.g):theoG,k=theoG>0?G/theoG:1,H=(pnum(P.h)>0?pnum(P.h):lig.reduce((s,z)=>s+z.theoH,0))*k0,purge=pnum(P.purge);

  lig.forEach(z=>filsDe(z.l).forEach(f=>add(f.articleId,pnum(f.qte)*z.n*k*k0,z.i)));
  const filTot=Object.values(conso).reduce((s,c)=>s+c.tot,0);
  if(purge>0&&filTot>0)Object.entries(conso).map(([aid,c])=>[aid,c.tot,{...c.par}]).forEach(([aid,t,par])=>{const part=purge*t/filTot;Object.entries(par).forEach(([i,q])=>add(aid,part*q/t,+i))});
  const recette=[];
  lig.forEach(z=>{filsDe(z.l).forEach(f=>{if(!ratee&&z.n)recette.push({i:z.i,articleId:f.articleId,theoU:pnum(f.qte),reelU:r3(pnum(f.qte)*k),fil:true})});
    if(z.b>0)autresDe(z.l).forEach(b=>{const key=z.i+"|"+b.articleId,theo=pnum(b.qte)*z.b,reel=P.reel[key]!=null&&String(P.reel[key]).trim()!==""?pnum(P.reel[key]):theo;add(b.articleId,reel,z.i);recette.push({i:z.i,articleId:b.articleId,theoU:pnum(b.qte),reelU:r3(reel/z.b),theo,reel,key})})});
  const plan={};Object.entries(conso).forEach(([aid,c])=>{plan[aid]={...c,...fifo(aid,c.tot,P.lotPref?.[aid])}});
  const W=wattsMat(lig.map(z=>matiereImp(z.l)).find(Boolean)||""),energie=H*(W/1000)*R.kwh+H*R.usure;
  const poids=lig.map(z=>z.theoG||z.n),pt=poids.reduce((s,v)=>s+v,0)||1;
  lig.forEach((z,j)=>{z.energie=energie*poids[j]/pt;z.mat=Object.values(plan).reduce((s,p)=>s+(p.par[z.i]?p.cost*p.par[z.i]/p.tot:0),0);
    z.mo=z.b*coutMO(z.l)+z.b*coutEmb();z.total=z.mat+z.energie+z.mo;z.cu=z.b>0?z.total/z.b:0;z.rebut=z.b>0?0:z.mat+z.energie});

  return{lig,G:G*k0,H,purge,plan,energie,recette,manque,ratee}}

      plateau:{g:r2(c.G),h:r2(c.H),purge:r2(c.purge),gcode:!!pnum(P.g)},principal:j===0,sorties:j===0?sorties:[],mvtIds:j===0?mvtIds:[]}})});

async function lireGcode(f){const tete=await f.slice(0,300000).text(),queue=f.size>300000?await f.slice(Math.max(0,f.size-300000)).text():"",t=tete+"\n"+queue;
  let g=0,h=0,mm=0,r=t.match(/;\s*(?:total )?filament used \[g\]\s*[=:]\s*([\d.,\s]+)/i)||t.match(/;\s*total filament weight(?: \[g\])?\s*[=:]\s*([\d.]+)/i);
  if(r)g=r[1].split(",").map(Number).filter(isFinite).reduce((a,b)=>a+b,0);
  if(!g&&(r=t.match(/;\s*Filament used:\s*([\d.]+)\s*m/i)))mm=parseFloat(r[1])*1000;
  if(!g&&(r=t.match(/;\s*filament used \[mm\]\s*=\s*([\d.,\s]+)/i)))mm=r[1].split(",").map(Number).filter(isFinite).reduce((a,b)=>a+b,0);

  return{g:Math.round(g*10)/10,h:Math.round(h*100)/100}}

async function annulerProd(k){if(stockVerrou){toast("Déverrouille d'abord avec le cadenas");return}const fs=S.fabrications.filter(f=>(f.prodId||f.id)===k);if(!fs.length)return;

/* ---------- Produits finis : par coloris et par lot, sortie des plus anciens d'abord ---------- */
const MOTIFS_SORTIE={perso:"Gardé pour moi",cadeau:"Offert",perdu:"Perdu ou cassé",test:"Échantillon / test",inventaire:"Correction d'inventaire"};
function restesFab(lid,col,exclu){col=col||"";
  const fabs=S.fabrications.filter(f=>f.leurreId===lid&&(f.coloris||"")===col&&Number(f.n)>0).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const rem=Object.fromEntries(fabs.map(f=>[f.id,Number(f.n)||0]));let libre=0;
  const outs=[...S.ventes.filter(v=>!(exclu&&exclu.c==="ventes"&&exclu.id===v.id)&&v.leurreId===lid&&(v.coloris||"")===col).map(v=>({q:Number(v.qte)||0,alloc:v.alloc})),
    ...S.sorties.filter(x=>!(exclu&&exclu.c==="sorties"&&exclu.id===x.id)&&x.leurreId===lid&&(x.coloris||"")===col).map(x=>({q:Number(x.n)||0,alloc:x.alloc}))];
  outs.forEach(o=>{if(o.alloc?.length)o.alloc.forEach(a=>{if(rem[a.fabId]!=null)rem[a.fabId]-=a.q;else libre+=a.q});else libre+=o.q});
  if(libre<0&&fabs.length)rem[fabs[fabs.length-1].id]-=libre;
  else for(const f of fabs){if(libre<=0)break;const t=Math.min(libre,Math.max(0,rem[f.id]));rem[f.id]-=t;libre-=t}
  return{lots:fabs.map(f=>({f,reste:rem[f.id]})),depasse:Math.max(0,libre)}}
const dispoC=(lid,col)=>{const r=restesFab(lid,col);return r.lots.reduce((s,x)=>s+x.reste,0)-r.depasse};
const clesStock=lid=>{const s=new Set(S.fabrications.filter(f=>f.leurreId===lid&&Number(f.n)>0).map(f=>f.coloris||""));S.ventes.filter(v=>v.leurreId===lid).forEach(v=>s.add(v.coloris||""));S.sorties.filter(x=>x.leurreId===lid).forEach(x=>s.add(x.coloris||""));return[...s].sort()};
function allocFifo(lid,col,q,exclu){const r=restesFab(lid,col,exclu),alloc=[];let rest=q,cost=0;
  for(const x of r.lots){if(rest<=0)break;const t=Math.min(rest,Math.max(0,x.reste));if(t>0){alloc.push({fabId:x.f.id,lot:lotDe(x.f),q:t});cost+=t*cuFab(x.f);rest-=t}}
  if(rest>0){const l=S.leurres.find(y=>y.id===lid);cost+=rest*(l?coutLeurre(l):0)}
  return{alloc,cu:q>0?cost/q:0,manque:rest}}
const valeurFinis=lid=>clesStock(lid).reduce((s,c)=>s+restesFab(lid,c).lots.reduce((t,x)=>t+Math.max(0,x.reste)*cuFab(x.f),0),0);
const derniereFab=id=>S.fabrications.filter(f=>f.leurreId===id&&Number(f.n)>0).map(f=>f.date||"").sort().pop()||"";
function vFinis(){
  const L=S.leurres.filter(l=>fabTot(l.id)>0).map(l=>({l,d:dispo(l.id),v:valeurFinis(l.id),pv:Number(l.prixVente)||0}));
  const enStock=L.filter(x=>x.d>0).sort((a,b)=>derniereFab(b.l.id).localeCompare(derniereFab(a.l.id))),vides=L.filter(x=>x.d<=0);
  const n=enStock.reduce((s,x)=>s+x.d,0),vc=enStock.reduce((s,x)=>s+x.v,0),vv=enStock.reduce((s,x)=>s+x.d*x.pv,0),sansPrix=enStock.filter(x=>!x.pv).length;
  const ligne=x=>{const cs=clesStock(x.l.id).map(c=>({c,r:restesFab(x.l.id,c)})).map(o=>({...o,d:o.r.lots.reduce((s,y)=>s+y.reste,0)-o.r.depasse})).filter(o=>o.d!==0);

    ${cs.some(o=>o.c)?`<div class="chips" style="margin:.3rem 0">${cs.map(o=>`<span class="pill ${o.d<0?"alert":""}">${esc(o.c||"sans coloris")} : ${o.d}</span>`).join("")}</div>`:""}
    <div class="sub">${fabTot(x.l.id)} fabriqué${fabTot(x.l.id)>1?"s":""}, ${venduTot(x.l.id)} vendu${venduTot(x.l.id)>1?"s":""}${sortiTot(x.l.id)?", "+sortiTot(x.l.id)+" sorti"+(sortiTot(x.l.id)>1?"s":"")+" hors vente":""} · dernier lot ${derniereFab(x.l.id)?new Date(derniereFab(x.l.id)).toLocaleDateString("fr-FR"):"—"}</div>
    <div class="sub">Valeur ${eur(x.v)} au coût réel${x.pv?" · prix "+eur(x.pv):" · prix de vente non fixé"}</div></div>
    <div style="text-align:center;min-width:4.5rem"><span class="num pill ${x.d>0?"ok":""}" style="font-size:1rem">${Math.max(0,x.d)}</span><div class="sub" style="font-size:.75rem">en stock</div></div></div>`};

  `<div class="kpis kpis3" style="margin-top:.75rem"><div class="kpi"><strong class="num">${n}</strong><span>leurre${n>1?"s":""} prêt${n>1?"s":""} à vendre</span></div><div class="kpi"><strong class="num">${eur(vc)}</strong><span>valeur au coût réel</span></div><div class="kpi"><strong class="num">${eur(vv)}</strong><span>valeur au prix de vente${sansPrix?` (${sansPrix} sans prix)`:""}</span></div></div>
  <section class="block"><h2>En stock</h2><div class="list">${enStock.length?enStock.map(ligne).join(""):`<div class="empty">Aucun leurre fini en stock. Lance une production : les pièces réussies arrivent ici.</div>`}</div></section>
  ${vides.length?`<details class="bloc"><summary>Épuisés (${vides.length})</summary><div class="list" style="margin-top:.6rem">${vides.map(ligne).join("")}</div></details>`:""}
  <p class="sub">Stock fini = fabriqués − vendus − sortis hors vente. Chaque pièce garde le coût réel de son lot ; les ventes prennent les lots les plus anciens en premier.</p>`;

    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>out.push(rows[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join("   ")))}

const sansAcc=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const TRAD={black:"noir",white:"blanc",red:"rouge",blue:"bleu",green:"vert",yellow:"jaune",grey:"gris",gray:"gris",clear:"transparent",silver:"argent",gold:"or",pink:"rose",purple:"violet",brown:"marron",hook:"hamecon",hooks:"hamecon",treble:"triple",split:"anneau",ring:"anneau",rings:"anneau",resin:"resine",epoxy:"resine"};

const RX_MONT=/-?\d{1,3}(?:[ .  ]\d{3})*[.,]\d{2}(?!\d)/g;

const RX_EXCL=/(total|tva|vat|sous-total|subtotal|livraison|frais de port|port\b|shipping|exp[ée]dition|transport|remise|r[ée]duction|discount|coupon|acompte|pay[ée]|paiement|solde|montant|iban|capital|siret|rcs|net [àa] payer)/i;
function analyserFacture(txt){const lignes=txt.split(/\r?\n/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean),low=sansAcc(txt);

  let date="",m=txt.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4}|\d{2})\b/);
  if(m){const y=m[3].length===2?"20"+m[3]:m[3];date=`${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  else if(m=low.match(/\b(\d{1,2})\s+(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)\s+(\d{4})/))date=`${m[3]}-${String(MOIS.indexOf(m[2])+1).padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  const ref=(txt.match(/(?:facture|invoice|commande|order)\s*(?:n[°o]\.?|no\.?|num[ée]ro|#)?\s*[:#]?\s*([A-Z0-9][A-Z0-9\-\/]{3,})/i)||[])[1]||"";
  const CONNUS=["Amazon","AliExpress","Creality","Sunlu","Elegoo","Bambu Lab","Polymaker","eSun","3DJake","Prusa","Geeetech","Anycubic","Smooth-On","Owner","BKK","Decathlon","Leroy Merlin","Castorama","Rougier & Plé","Cultura","Action","Temu","Shein","Pêcheur.com","Pacific Pêche","Decathlon"];
  const four=CONNUS.map(c=>({c,i:low.indexOf(sansAcc(c))})).filter(x=>x.i>=0).sort((a,b)=>a.i-b.i)[0]?.c||"";
  let total=0,port=0;const cand=[];
  lignes.forEach(L=>{const am=(L.match(RX_MONT)||[]).map(montant);if(!am.length)return;const lo=sansAcc(L);
    if(/(total|net a payer|montant)/.test(lo)&&!/sous/.test(lo)&&!/ht\b/.test(lo)){total=Math.max(total,Math.abs(am[am.length-1]));return}
    if(/(livraison|frais de port|shipping|expedition|transport)/.test(lo)){port+=Math.abs(am[am.length-1]);return}

function matchArticle(lib){const w=new Set(motsDe(lib));let best="",sc=0;

  const txt="Courses Atelier\n"+four.map(f=>"\n"+f+"\n"+L.filter(a=>(a.fournisseur||"Sans fournisseur")===f).map(a=>{const k=suggestion(a),c=cfg(a);return`- ${nomArt(a)} : ${k} ${k>1?c.lotsNom:c.lotNom}`}).join("\n")).join("\n");
  (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast("Liste copiée, colle-la dans tes notes ou un message")).catch(()=>{body.innerHTML=`<h2>Liste de courses</h2><textarea style="min-height:16rem">${esc(txt)}</textarea><div class="actions"><button class="btn" onclick="dlg.close()">Fermer</button></div>`;dlg.showModal()});

/* Fenêtres : clic à côté = fermer, avec confirmation si une saisie est en cours */
function fermable(d){let bas=null;
  d.addEventListener("pointerdown",e=>{bas=e.target});
  d.addEventListener("input",()=>{d._sale=true});
  d.addEventListener("close",()=>{d._sale=false});
  const ok=()=>!d._sale||confirm("Fermer sans enregistrer ? Ce que tu as saisi sera perdu.");
  d.addEventListener("cancel",e=>{if(!ok())e.preventDefault()});
  d.addEventListener("click",e=>{if(e.target!==d||bas!==d)return;const r=d.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)return;if(ok())d.close()});
}
function toast(t,action){const e=$("#toast");e.textContent=t;e.classList.toggle("act",!!action);
  if(action){const b=document.createElement("button");b.textContent=action.label;b.onclick=()=>{e.classList.remove("show","act");clearTimeout(e._t);action.fn()};e.appendChild(b)}
  e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show","act"),action?6000:2200)}
const dernierAppui={};
const MOTIFS={achat:"Achat",sortie:"Sortie",fabrication:"Fabrication",annulation:"Annulation",correction:"Correction",initial:"Stock initial",perte:"Perte / casse",rebut:"Impression ratée",inventaire:"Inventaire"};
function mvt(a,delta,motif,x={}){return{op:"set",c:"mouvements",id:uid(),data:{date:new Date().toISOString(),articleId:a.id,nom:nomArt(a),categorie:a.categorie||"",delta:Math.round(delta*1000)/1000,unite:a.unite||"",motif,cout:x.cout??null,projetId:x.projetId||"",ref:x.ref||""}}}
async function lancer(ops,ok,undoOps){try{await store.batch(ops);toast(ok,undoOps?{label:"Annuler",fn:()=>store.batch(undoOps).then(()=>toast("Annulé")).catch(e=>toast("Échec : "+(e.code||"erreur")))}:undefined)}catch(e){toast("Échec : "+(e.code||"erreur"))}}
function bouger(id,sens){if(stockVerrou){toast("Déverrouille d'abord avec le cadenas");return}const a=art(id);if(!a)return;
  const t=Date.now();if(t-(dernierAppui[id]||0)<800)return;dernierAppui[id]=t;
  const L=lotQ(a),q=Number(a.qte)||0;
  if(sens>0){const e=opsEntree(a,L,pu(a));lancer(e.ops,"+ "+fmt(L)+" "+a.unite+" "+nomArt(a)+(pu(a)>0?" au dernier prix ("+eur(pu(a)*L)+")":", prix inconnu : corrige-le dans l'article"),e.undo);return}
  if(q<=0){toast("Stock déjà à zéro");return}
  const d=Math.min(L,q),s=opsSortie(a,d,"sortie");lancer(s.ops,"− "+fmt(d)+" "+a.unite+" "+nomArt(a),s.undo);
}

function wire(c,id,build){
  const orig0=id?JSON.parse(JSON.stringify(S[c].find(x=>x.id===id)||{})):null;
  $("#ok").onclick=async()=>{const o=build();if(!o)return;dlg.close();
    if(c==="articles"){const avant=id?Number(orig0.qte)||0:0,apres=Number(o.qte)||0;
      if(apres!==avant){const base={op:"set",c,id:o.id,data:id?{...orig0,...o,qte:avant,id:undefined}:{...o,qte:0,medias:[],id:undefined}},a2={...orig0,...o,qte:avant};
        const mv=apres>avant?opsEntree(a2,apres-avant,pu(a2),{motif:id?"correction":"initial",origine:id?"ajustement":"achat"}).ops:opsSortie(a2,avant-apres,"correction").ops;
        try{await store.batch([base,...mv]);toast("Enregistré");}catch(e){toast("Échec de l'enregistrement : "+(e.code||"erreur"))}return}}
    if(!id){await save(c,{...o,medias:[]});toast("Enregistré");return}
    const diff={};Object.keys(o).forEach(k=>{if(k!=="id"&&JSON.stringify(o[k])!==JSON.stringify(orig0[k]))diff[k]=o[k]});
    if(Object.keys(diff).length){await upd(c,id,diff);toast("Enregistré")}else toast("Aucune modification")};
  if(id)$("#del").onclick=async()=>{
    let msg="Supprimer définitivement ? Cette action est irréversible.";
    if(c==="articles"){const us=S.leurres.filter(l=>(l.bom||[]).some(b=>b.articleId===id));if(us.length)msg=`Cet article est utilisé dans ${us.length} fiche${us.length>1?"s":""} leurre (${us.map(l=>l.nom).join(", ")}). Le supprimer cassera leur nomenclature et leur coût. Supprimer quand même ?`}
    if(confirm(msg)){dlg.close();await remove(c,id);toast("Supprimé")}};
}

async function enregistrerAchat(id){const a=art(id);if(!a)return;

async function lireSTL(f){const buf=await f.arrayBuffer(),dv=new DataView(buf);let V=0,n=0;
  const tri=(a,b,c)=>{V+=(a[0]*(b[1]*c[2]-b[2]*c[1])-a[1]*(b[0]*c[2]-b[2]*c[0])+a[2]*(b[0]*c[1]-b[1]*c[0]))/6;n++};
  const bin=buf.byteLength>=84&&84+dv.getUint32(80,true)*50===buf.byteLength;
  if(bin){const N=dv.getUint32(80,true);for(let i=0;i<N;i++){const o=84+i*50+12,v=k=>[dv.getFloat32(o+k*12,true),dv.getFloat32(o+k*12+4,true),dv.getFloat32(o+k*12+8,true)];tri(v(0),v(1),v(2))}}
  else{const t=new TextDecoder().decode(buf),m=[...t.matchAll(/vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g)].map(x=>[+x[1],+x[2],+x[3]]);for(let i=0;i+2<m.length;i+=3)tri(m[i],m[i+1],m[i+2])}
  return{cm3:Math.abs(V)/1000,tri:n}}

  const elec=h*W/1000*R.kwh,us=h*R.usure;return{mat:f.cost,elec,us,total:f.cost+elec+us,q,W,m,parts:f.parts,pug:q>0?f.cost/q:0}}
async function importerSTL(f){if(!f)return;const r=await lireSTL(f);if(!r.tri){$("#gcinfo").textContent="Fichier STL illisible.";return}

function vCoutProd(){const an=String(new Date().getFullYear()),G=groupesProd().filter(g=>g.date.startsWith(an));
  const rows=G.map(g=>{const fs=g.fs,tot=fs.reduce((s,f)=>s+(Number(f.cout)||0),0),el=fs.reduce((s,f)=>s+(Number(f.coutImp)||0),0),reb=fs.reduce((s,f)=>s+(Number(f.coutRebut)||0),0),n=fs.reduce((s,f)=>s+(Number(f.n)||0),0);
    const cs=fs.flatMap(f=>f.conso||[]),mat=cs.some(c=>c.cout!=null)?cs.reduce((s,c)=>s+(Number(c.cout)||0),0):null,fil=cs.filter(c=>art(c.articleId)?.categorie==="Filament"),fq=fil.reduce((s,c)=>s+(Number(c.qte)||0),0),fc=fil.reduce((s,c)=>s+(Number(c.cout)||0),0),pg=Number(fs[0].plateau?.purge)||0,pur=fq>0&&mat!=null?pg*fc/fq:null;
    return{g,tot,el,reb,n,mat,pur,mo:mat!=null?tot-mat-el:null}});
  const P=S.projets.flatMap(p=>(p.impressions||[]).filter(i=>i.statut==="imprimee"&&(i.date||"").startsWith(an)).map(i=>({p,i})));
  const T=rows.reduce((s,r)=>s+r.tot,0)+P.reduce((s,x)=>s+(Number(x.i.cout?.total)||0),0),N=rows.reduce((s,r)=>s+r.n,0),R=rows.reduce((s,r)=>s+r.reb,0);
  return`<p class="sub" style="margin:.75rem 0">Coûts réels ${an}, figés au moment de la production : matière au prix des bobines utilisées (purge comprise), électricité selon le matériau, main d'œuvre et emballage de tes réglages.</p>

  S.ventes.forEach(v=>{O.push({date:v.date,type:"vente",lib:`${v.nom} ${v.version||""}${v.coloris?" "+v.coloris:""} × ${v.qte}`,cat:"Ventes",four:v.canal+(v.client?", "+v.client:""),m:ca(v),act:`editVente('${v.id}')`});
    const fr=(Number(v.commission)||0)+(Number(v.port)||0);if(fr)O.push({date:v.date,type:"depense",lib:`Frais de vente : ${v.nom}`,cat:"Frais de vente",four:v.canal,m:-fr,act:`editVente('${v.id}')`})});

  <div class="kpis kpis3"><div class="kpi"><strong class="num">${eur(dep)}</strong><span>dépensé</span></div><div class="kpi"><strong class="num">${eur(rec)}</strong><span>encaissé (ventes)</span></div><div class="kpi"><strong class="num ${sol<0?"st-crit":"st-ok"}">${sol<0?"−":"+"} ${eur(Math.abs(sol))}</strong><span>solde</span></div></div>
  ${C.length?`<section class="block"><h2>Dépenses par catégorie</h2><div class="pan" style="gap:.2rem">${C.map(([c,v])=>`<div class="vc" title="${esc(c)} : ${eur(v)}"><span>${esc(c)}</span><div class="vc-t"><i style="width:${Math.max(2,v/mx*100)}%"></i></div><span class="num">${eur(v)}</span></div>`).join("")}</div></section>`:""}

  <p class="sub">Les achats de stock viennent des lots (achats, factures importées). Les ventes et leurs frais viennent de l'onglet Ventes. Ajoute ici tout le reste : outils, pièces de l'imprimante, abonnements…</p>`}

function glisser(e,cle){const h=e.currentTarget,row=h.closest("[data-i]"),list=row.parentElement;e.preventDefault();h.setPointerCapture(e.pointerId);row.classList.add("glisse");
  const mv=ev=>{const prev=row.previousElementSibling,next=row.nextElementSibling;
    if(prev){const r=prev.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){list.insertBefore(prev,row.nextSibling);return}}
    if(next){const r=next.getBoundingClientRect();if(ev.clientY>r.top+r.height/2)list.insertBefore(next,row)}};
  const fin=()=>{h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",fin);h.removeEventListener("pointercancel",fin);row.classList.remove("glisse");
    const L=LISTES_TRIABLES[cle],a=L.arr(),ordre=[...list.children].map(x=>+x.dataset.i);if(ordre.some((v,k)=>v!==k)){L.set(ordre.map(k=>a[k]));L.draw();const d=list.closest("dialog");if(d)d._sale=true}};
  h.addEventListener("pointermove",mv);h.addEventListener("pointerup",fin);h.addEventListener("pointercancel",fin)}
function glisserClavier(e,cle,i){const d=e.key==="ArrowUp"?-1:e.key==="ArrowDown"?1:0;if(!d)return;e.preventDefault();const L=LISTES_TRIABLES[cle],a=[...L.arr()],j=i+d;if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];L.set(a);L.draw();const z=document.querySelectorAll(`#${cle} .poignee`)[j];z&&z.focus();const dl=z?.closest("dialog");if(dl)dl._sale=true}

function parseDuree(v){v=String(v||"").trim().toLowerCase();if(!v)return 0;
  const m=v.match(/^(?:(\d+)\s*j)?\s*(?:(\d+)\s*h)?\s*(?:(\d+)\s*(?:m|min))?$/);
  if(m&&(m[1]||m[2]||m[3])&&/[jhm]/.test(v)){const h=(+m[1]||0)*24+(+m[2]||0)+(+m[3]||0)/60;return Math.round(h*100)/100}
  const hm=v.match(/^(\d+)h(\d+)$/);if(hm)return Math.round((+hm[1]+hm[2]/60)*100)/100;
  return pnum(v)}
const DENS=Object.fromEntries(FIL.map(f=>[f.id,f.densite]));
async function importerGcode(f){if(!f)return;
  const tete=await f.slice(0,300000).text(),queue=f.size>300000?await f.slice(Math.max(0,f.size-300000)).text():"",t=tete+"\n"+queue;
  let g=0,h=0,mm=0;
  let r=t.match(/;\s*(?:total )?filament used \[g\]\s*[=:]\s*([\d.,\s]+)/i)||t.match(/;\s*total filament weight(?: \[g\])?\s*[=:]\s*([\d.]+)/i);
  if(r)g=r[1].split(",").map(Number).filter(isFinite).reduce((a,b)=>a+b,0);
  if(!g&&(r=t.match(/;\s*Filament used:\s*([\d.]+)\s*m/i)))mm=parseFloat(r[1])*1000;
  if(!g&&(r=t.match(/;\s*filament used \[mm\]\s*=\s*([\d.,\s]+)/i)))mm=r[1].split(",").map(Number).filter(isFinite).reduce((a,b)=>a+b,0);
  const tps=t.match(/;\s*(?:estimated printing time(?: \(normal mode\))?|total estimated time|model printing time)\s*[=:]\s*([^\n;]+)/i);
  if(tps){const x=tps[1];const v=k=>{const m=x.match(new RegExp("(\\d+)\\s*"+k));return m?+m[1]:0};h=v("d")*24+v("h")+v("m")/60+v("s")/3600}
  if(!h&&(r=t.match(/;TIME:(\d+)/)))h=+r[1]/3600;
  const fils=tmpBom.map((b,i)=>({b,i,a:art(b.articleId)})).filter(x=>x.b.cat==="Filament"||x.a?.categorie==="Filament");
  if(!g&&mm){const dens=DENS[fils[0]?.a?.matiere]||1.24;g=mm/10*Math.PI*0.0875*0.0875*dens}
  g=Math.round(g*10)/10;h=Math.round(h*100)/100;
  if(!g&&!h){$("#gcinfo").textContent="Aucune information de poids ou de temps trouvée dans ce fichier. Vérifie qu'il vient bien du slicer (Creality Print, Orca, Prusa, Cura).";return}
  if(h)$("#f_imph").value=vIn(h);
  let msg=`Lu dans le G-code : ${g?fmt(g,1)+" g de filament":""}${g&&h?", ":""}${h?fmt(h)+" h d'impression":""}.`;
  if(g){if(fils.length===1){fils[0].b.qte=g;msg+=" Poids reporté sur la ligne filament."}
    else if(!fils.length){tmpBom.push({cat:"Filament",articleId:"",qte:g});msg+=" Choisis le filament dans la nouvelle ligne de la nomenclature."}
    else msg+=" Plusieurs filaments dans la nomenclature : répartis le poids à la main."}
  drawBom();$("#gcinfo").textContent=msg+" Pense à enregistrer.";
}

function vBilan(){

  const mois=[];const d0=new Date();for(let i=11;i>=0;i--){const d=new Date(d0.getFullYear(),d0.getMonth()-i,1);mois.push({k:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),l:d.toLocaleDateString("fr-FR",{month:"short"}).replace(".","")})}
  mois.forEach(m=>{const vs=V.filter(v=>(v.date||"").startsWith(m.k));m.ca=vs.reduce((s,v)=>s+ca(v),0);m.mg=vs.reduce((s,v)=>s+margeV(v),0)});
  const parM={};V.forEach(v=>{const k=v.leurreId||v.nom;parM[k]=parM[k]||{nom:v.nom+" "+(v.version||""),q:0,ca:0,mg:0};parM[k].q+=Number(v.qte)||0;parM[k].ca+=ca(v);parM[k].mg+=margeV(v)});

  if(!V.length)return`<div class="list" style="margin-top:.75rem"><div class="empty">Le bilan apparaîtra dès ta première vente.</div></div>`;
  return`<div class="kpis" style="margin-top:.75rem"><div class="kpi"><strong class="num">${eur(CA)}</strong><span>chiffre d'affaires ${an}</span></div><div class="kpi ${M<0?"warn":""}"><strong class="num">${eur(M)}</strong><span>marge nette ${an}</span></div><div class="kpi"><strong>${N}</strong><span>leurres vendus en ${an}</span></div><div class="kpi ${enc?"warn":""}"><strong class="num">${eur(enc)}</strong><span>reste à encaisser</span></div></div>
  ${C?`<p class="sub">Cotisations estimées sur ${an} : ${eur(C)}, déjà déduites de la marge.</p>`:""}

  <section class="block"><h2>Par modèle</h2><div class="tw"><table class="ref"><thead><tr><th>Leurre</th><th>Vendus</th><th>Chiffre d'affaires</th><th>Marge</th><th>Marge %</th></tr></thead><tbody>${Object.values(parM).sort((a,b)=>b.ca-a.ca).map(x=>`<tr><td>${esc(x.nom)}</td><td class="n">${x.q}</td><td class="n">${eur(x.ca)}</td><td class="n">${eur(x.mg)}</td><td class="n">${x.ca?fmt(x.mg/x.ca*100,0)+" %":"—"}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="block"><h2>Par canal</h2><div class="tw"><table class="ref"><thead><tr><th>Canal</th><th>Vendus</th><th>Chiffre d'affaires</th><th>Marge</th></tr></thead><tbody>${Object.entries(parC).sort((a,b)=>b[1].ca-a[1].ca).map(([k,x])=>`<tr><td>${esc(k)}</td><td class="n">${x.q}</td><td class="n">${eur(x.ca)}</td><td class="n">${eur(x.mg)}</td></tr>`).join("")}</tbody></table></div></section>`;
}
function graphe(m){
  const W=640,H=220,pl=46,pb=26,pt=10,iw=W-pl-8,ih=H-pb-pt;
  const max=Math.max(...m.map(x=>Math.max(x.ca,x.mg)),1),min=Math.min(0,...m.map(x=>x.mg));
  const pas=[1,2,5,10,20,50,100,200,500,1000,2000,5000].find(p=>(max-min)/p<=5)||10000,top=Math.ceil(max/pas)*pas,bot=Math.floor(min/pas)*pas;
  const y=v=>pt+ih-(v-bot)/(top-bot||1)*ih,gw=iw/m.length,bw=Math.min(16,gw/2-3);
  let g="";for(let v=bot;v<=top;v+=pas)g+=`<line x1="${pl}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v.toLocaleString("fr-FR")} €</text>`;
  const bar=(x,v,cls,lbl)=>{const y0=y(0),y1=y(v),h=Math.abs(y1-y0);if(!v)return"";const yy=Math.min(y0,y1),r=Math.min(4,h);
    const d=v>0?`M${x},${y0}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${y0}Z`:`M${x},${y0}V${yy+h-r}Q${x},${yy+h} ${x+r},${yy+h}H${x+bw-r}Q${x+bw},${yy+h} ${x+bw},${yy+h-r}V${y0}Z`;
    return`<path d="${d}" class="${cls}"><title>${lbl}</title></path>`};
  const bars=m.map((x,i)=>{const cx=pl+gw*i+gw/2;return bar(cx-bw-1,x.ca,"b1",`${x.l} : chiffre d'affaires ${eur(x.ca)}`)+bar(cx+1,x.mg,"b2",`${x.l} : marge ${eur(x.mg)}`)+`<text x="${cx}" y="${H-8}" text-anchor="middle" class="ax">${x.l}</text>`}).join("");
  return`<div class="viz"><div class="lgd"><span><i class="b1"></i>Chiffre d'affaires</span><span><i class="b2"></i>Marge nette</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d'affaires et marge par mois sur 12 mois" style="width:100%;height:auto">${g}<line x1="${pl}" x2="${W-8}" y1="${y(0)}" y2="${y(0)}" class="base"/>${bars}</svg>
  <details><summary class="sub">Voir les valeurs</summary><div class="tw"><table class="ref"><thead><tr><th>Mois</th><th>Chiffre d'affaires</th><th>Marge</th></tr></thead><tbody>${m.map(x=>`<tr><td>${x.l}</td><td class="n">${eur(x.ca)}</td><td class="n">${eur(x.mg)}</td></tr>`).join("")}</tbody></table></div></details></div>`;
}

async function photoEsp(sci,wiki){
  if(PH[sci]!==undefined)return PH[sci];
  const c=photoCache(sci);if(c&&c.u&&c.t>Date.now()-30*864e5)return PH[sci]=c.u;
  const json=async u=>{try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}};
  const rest=async (dom,t)=>{const j=await json(`https://${dom}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g,"_"))}`);return j?.thumbnail?.source||""};
  const api=async (dom,t)=>{const j=await json(`https://${dom}.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=480&redirects=1&format=json&origin=*&titles=${encodeURIComponent(t)}`);const pg=j&&Object.values(j.query?.pages||{})[0];return pg?.thumbnail?.source||""};
  PH[sci]=(async()=>{
    let u=await rest("en",sci);
    if(!u&&wiki)u=await rest("fr",wiki.replace(/_/g," "));
    if(!u)u=await api("en",sci);
    if(!u&&wiki)u=await api("fr",wiki.replace(/_/g," "));
    if(u)photoCache(sci,{u,t:Date.now()});
    PH[sci]=u||undefined;return u;
  })();
  return PH[sci];
}

  const zone=$("#envoi");
  for(const f0 of [...files]){
    zone.innerHTML=`<div class="sub">Envoi de ${esc(f0.name)}…</div><div class="prog"><i id="pr"></i></div>`;
    try{const f=await compresser(f0),video=f0.type.startsWith("video/");
      let nom=Date.now()+"-"+f0.name.replace(/[^\w.\-]+/g,"_");if(f!==f0)nom=nom.replace(/\.\w+$/,"")+".jpg";
      const it=await OD.envoyer(f,nom,c+"/"+id,p=>{const b=$("#pr");if(b)b.style.width=Math.round(p*100)+"%"});
      await store.addMedia(c,id,{id:it.id,nom:f0.name,video,taille:it.size||f.size,date:new Date().toISOString()});
    }catch(e){toast("Échec de l'envoi de "+f0.name+" : "+e.message)}
  }
  zone.innerHTML="";setTimeout(()=>drawMedia(c,id),400);
}
const viewer=$("#viewer");
async function voirMedia(c,id,i){
  const m=((S[c].find(x=>x.id===id)||{}).medias||[])[i];if(!m)return;
  const vb=$("#viewerBody");vb.innerHTML=`<p class="sub">Chargement…</p>`;viewer.showModal();
  try{const it=await OD.item(m.id),u=it["@microsoft.graph.downloadUrl"];
    vb.innerHTML=`<h3>${esc(m.nom)}</h3>${m.video?`<video src="${esc(u)}" controls playsinline></video>`:`<img src="${esc(u)}" alt="${esc(m.nom)}">`}
    <p class="sub" style="margin:0">${((m.taille||0)/1048576).toFixed(1)} Mo, ajouté le ${new Date(m.date).toLocaleDateString("fr-FR")}</p>
    <div class="actions"><button class="btn danger" id="vdel">Supprimer</button><span class="spacer"></span><a class="btn ghost" href="${esc(it.webUrl)}" target="_blank" rel="noopener">Ouvrir dans OneDrive</a><button class="btn" onclick="viewer.close()">Fermer</button></div>`;
    $("#vdel").onclick=async()=>{if(!confirm("Supprimer ce média ? Il ira dans la corbeille OneDrive."))return;
      try{await OD.api("/me/drive/items/"+m.id,{method:"DELETE"})}catch(e){}
      await store.removeMedia(c,id,m);viewer.close();toast("Média supprimé");setTimeout(()=>drawMedia(c,id),400)};
  }catch(e){vb.innerHTML=`<p>Impossible d'ouvrir ce média : ${esc(e.message)}</p><div class="actions"><button class="btn" onclick="viewer.close()">Fermer</button></div>`}
}
init();
</script>

window.MS_CLIENT_ID = window.ATELIER_CONFIG?.microsoftClientId || "";

try{
  if(!firebaseConfig.apiKey){ window.FB={ok:false}; }
  else{
    const [{initializeApp},fs,au]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-firestore.js"),import(B+"firebase-auth.js")]);
    const app=initializeApp(firebaseConfig);
    window.FB={ok:true,db:fs.getFirestore(app),collection:fs.collection,doc:fs.doc,setDoc:fs.setDoc,deleteDoc:fs.deleteDoc,onSnapshot:fs.onSnapshot,query:fs.query,orderBy:fs.orderBy,limit:fs.limit,updateDoc:fs.updateDoc,increment:fs.increment,arrayUnion:fs.arrayUnion,arrayRemove:fs.arrayRemove,writeBatch:fs.writeBatch,
      auth:au.getAuth(app),onAuthStateChanged:au.onAuthStateChanged,signInWithEmailAndPassword:au.signInWithEmailAndPassword,signOut:au.signOut};
  }
}catch(e){ window.FB={ok:false,err:String(e)}; }
dispatchEvent(new Event("fb-ready"));
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
