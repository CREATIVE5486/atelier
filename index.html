<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier">
<meta name="theme-color" content="#18293A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F2; --panel:#FFFFFF; --ink:#18293A; --muted:#5D6B78; --line:#CDD5DC;
  --accent:#E39B12; --accent-ink:#2A1A00; --ok:#2E7D6B; --alert:#C2412D; --chip:#E2E8EC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A24; --panel:#172532; --ink:#E4EBF0; --muted:#93A3B1; --line:#2A3B4B;
  --accent:#F0AE2E; --accent-ink:#2A1A00; --ok:#4FB39A; --alert:#E36A55; --chip:#223443;
}}
:root[data-theme="dark"]{
  --bg:#0F1A24; --panel:#172532; --ink:#E4EBF0; --muted:#93A3B1; --line:#2A3B4B;
  --accent:#F0AE2E; --accent-ink:#2A1A00; --ok:#4FB39A; --alert:#E36A55; --chip:#223443;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;font-weight:700;margin:0;line-height:1.1}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.15rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--nav);color:#EDF0F2;padding:1.25rem .75rem;display:flex;flex-direction:column;gap:.25rem}
nav.side .brand{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:700;padding:0 .5rem 1rem}
nav button.tab{background:none;border:0;text-align:left;padding:.6rem .75rem;border-radius:6px;color:inherit;opacity:.75;font-weight:500}
nav button.tab[aria-current="page"]{opacity:1;background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--accent)}
.sync{margin-top:auto;font-size:.8rem;opacity:.7;padding:.5rem}
.sync b{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--muted);margin-right:.4rem}
.sync.on b{background:var(--ok)} .sync.off b{background:var(--alert)}

main{padding:1.5rem clamp(1rem,3vw,2.5rem) 6rem;max-width:1100px;width:100%;min-width:0}
main a{color:var(--ink);text-underline-offset:2px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
.btn{border:0;border-radius:6px;padding:.55rem 1rem;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--alert);border:1px solid var(--alert)}
.btn.sm{padding:.3rem .65rem;font-size:.9rem}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:1.5rem}
.kpi{background:var(--panel);padding:1rem}
.kpi strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:2rem;line-height:1}
.kpi span{color:var(--muted);font-size:.9rem}
.kpi.warn strong{color:var(--alert)}

section.block{margin-bottom:1.75rem}
section.block > h2{margin-bottom:.6rem}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.row{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.click{cursor:pointer} .row.click:hover{background:var(--chip)}
.row .grow{flex:1;min-width:0}
.row .sub{color:var(--muted);font-size:.88rem}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:.78rem;font-weight:600;padding:.12rem .5rem;border-radius:99px;background:var(--chip);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.alert{background:color-mix(in srgb,var(--alert) 18%,transparent);color:var(--alert)}
.pill.acc{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.bar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;background:var(--ok)}
.empty{padding:1.5rem 1rem;color:var(--muted)}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.75rem}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:.25rem .8rem;font-size:.9rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qty{display:flex;align-items:center;gap:.25rem}
.lock{display:inline-flex;align-items:center;gap:.4rem}
.lock.open{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.qty button:disabled{opacity:.3;cursor:not-allowed}
.qty button{width:2rem;height:2rem;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-weight:600}

dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.55)}
.dlg{padding:1.25rem;display:flex;flex-direction:column;gap:.85rem;overflow:auto;max-height:90vh}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.88rem;color:var(--muted);font-weight:500}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;background:var(--bg);font-size:1rem;width:100%}
textarea{min-height:4.5rem;resize:vertical}
input[type=checkbox]{width:1.2rem;height:1.2rem;flex:none;padding:0}
.actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.actions .spacer{flex:1}
.bomline,.task{display:flex;gap:.5rem;align-items:center}
.bomline select{flex:1}.bomline input{width:5.5rem}
.task input[type=text]{flex:1}.task input[type=checkbox]{width:1.2rem;height:1.2rem}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;padding:0 .3rem}
.toast{position:fixed;left:50%;bottom:calc(5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.toast{width:max-content;max-width:92vw}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:1rem}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:.2rem .3rem;text-decoration:underline}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;padding:.35rem .25rem calc(.35rem + env(safe-area-inset-bottom,0px));z-index:5;gap:0}
  nav.side .brand,.sync{display:none}
  nav button.tab{flex:1;text-align:center;font-size:.8rem;padding:.55rem .1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav button.tab[aria-current="page"]{box-shadow:inset 0 3px 0 var(--accent)}
  h1{font-size:1.7rem}
  .grid2{grid-template-columns:1fr}
  .mob-sync{display:block}
}
nav.side[hidden]{display:none!important}.app:has(nav.side[hidden]){grid-template-columns:1fr}
.mob-sync{display:none;font-size:.8rem;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.4rem}
.gal button{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;background:var(--chip)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .vid{position:absolute;right:.3rem;bottom:.3rem;background:rgba(0,0,0,.65);color:#fff;font-size:.72rem;padding:.05rem .35rem;border-radius:4px}
.gal .ph{display:flex;align-items:center;justify-content:center;height:100%;font-size:.75rem;color:var(--muted);padding:.3rem;text-align:center;word-break:break-all}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0}
#viewer{width:min(960px,96vw)} #viewer img,#viewer video{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:6px;background:#000}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.ref{border-collapse:collapse;width:100%;font-size:.92rem}
table.ref th,table.ref td{padding:.5rem .65rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.ref th{background:var(--chip);font-weight:600;white-space:nowrap}
table.ref tr:last-child td{border-bottom:0}
table.ref td:first-child{white-space:nowrap}
table.ref td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.refcard{margin-bottom:1.5rem}
.refcard .meta{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;margin-bottom:.4rem;flex-wrap:wrap}
.refcard p{margin:.4rem 0 0;color:var(--muted);font-size:.9rem;max-width:70ch}
.grid-ed{overflow-x:auto}
.grid-ed table{border-collapse:collapse}
.grid-ed td{padding:2px}
.grid-ed input{min-width:7.5rem;padding:.35rem .45rem;font-size:.92rem}
.grid-ed thead input{font-weight:600;background:var(--chip)}
.search{margin-bottom:1rem}
.back{background:none;border:0;padding:.2rem 0;color:var(--muted);font-weight:600;margin-bottom:.5rem}
.back:hover{color:var(--ink)}
.grp{margin:0 0 .4rem;font-size:1rem;color:var(--muted);font-family:Barlow,sans-serif;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:1.25rem}
.seg button{border:0;background:var(--panel);padding:.5rem 1.1rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.9rem;margin-bottom:1.75rem}
.sp{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.sp .ph{aspect-ratio:16/10;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;cursor:pointer;border:0;padding:0;width:100%}
.sp .ph img,.spd .ph img{width:100%;height:100%;object-fit:cover;display:block}
.sp .bd{padding:.7rem .8rem .85rem;display:flex;flex-direction:column;gap:.35rem}
.sp h3{cursor:pointer}
.sci{font-style:italic;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:.12rem .55rem;font-size:.82rem}
.chips button:hover{border-color:var(--ink)}
.lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.spd .ph{aspect-ratio:16/9;background:var(--chip);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.spd dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;margin:0}
.spd dt{color:var(--muted);font-size:.88rem;font-weight:600}.spd dd{margin:0}

:root{--nav:#18293A;--good:#0ca30c;--warn:#b07a00;--crit:#d03b3b;--track:#dfe5ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nav:#0a1219;--good:#3fbf3f;--warn:#fab219;--crit:#ef6b6b;--track:#22313f}}
:root[data-theme="dark"]{--nav:#0a1219;--good:#3fbf3f;--warn:#fab219;--crit:#ef6b6b;--track:#22313f}
main{max-width:1280px}
.stock-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.stock-pan{position:sticky;top:1rem}
.seg-mob{display:none}
@media (max-width:980px){.stock-grid{grid-template-columns:1fr}.seg-mob{display:inline-flex}.vue-liste .stock-pan{display:none}.vue-visuel .stock-liste{display:none}.stock-pan{position:static}}
.pan{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem;display:flex;flex-direction:column;gap:1.25rem}
.pan h3{font-size:1.05rem}
p.sub{color:var(--muted);font-size:.88rem}
.pan-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.pan-kpi div{display:flex;flex-direction:column}
.pan-kpi strong{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;line-height:1.1;color:var(--ink)}
.pan-kpi span{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.25rem}
.st-ok{color:var(--good)}.st-warn{color:var(--warn)}.st-crit{color:var(--crit)}
.pan-kpi .st-crit span svg{color:var(--crit)}.pan-kpi .st-warn span svg{color:var(--warn)}
.pan-kpi .st-crit span,.pan-kpi .st-warn span{color:var(--muted)}
.bobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.6rem}
.bob{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.6rem .4rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;text-align:center}
.bob:hover{border-color:var(--ink)}
.bob-r{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c) var(--p),var(--track) 0);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.bob-in{width:44px;height:44px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;line-height:1;box-shadow:0 0 0 1px var(--line)}
.bob-in small{font-family:Barlow,sans-serif;font-weight:500;font-size:.62rem;color:var(--muted)}
.bob-n{font-size:.82rem;font-weight:600;line-height:1.15}
.bob-q{font-size:.75rem;color:var(--muted)}
.bob-s{font-size:.72rem;display:flex;align-items:center;gap:.2rem}
.jg{padding:.45rem 0;border-top:1px solid var(--line)}
.jg:first-of-type{border-top:0}
.jg-h{display:flex;justify-content:space-between;gap:.5rem;font-size:.88rem}
.jg-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-t{position:relative;height:8px;background:var(--track);border-radius:4px;margin:.3rem 0 .2rem}
.jg-t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;min-width:3px}
.jg-t i.s-ok{background:var(--good)}.jg-t i.s-warn{background:var(--warn)}.jg-t i.s-crit{background:var(--crit)}
.jg-t b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);transform:translateX(-1px);border-radius:1px}
.jg-f{font-size:.75rem;display:flex;align-items:center;gap:.3rem}
.jg-f .sub{margin-left:auto;font-size:.72rem}
.vc{display:grid;grid-template-columns:6.5rem 1fr auto;gap:.5rem;align-items:center;font-size:.85rem;padding:.2rem 0}
.vc-t{height:10px;background:var(--track);border-radius:4px;overflow:hidden}
.vc-t i{display:block;height:100%;background:var(--ink);opacity:.75;border-radius:4px}
.bandeau{display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:8px;padding:.7rem 1rem;margin-bottom:1.25rem}
.bandeau svg{color:var(--warn);vertical-align:-1px}
.bloc{border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem}
.bloc summary{cursor:pointer;font-weight:600}
.bloc-in{border-top:1px solid var(--line);padding-top:.8rem}
.mv,.essai{display:grid;grid-template-columns:4.6rem 1fr auto auto;gap:.6rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line);font-size:.9rem}
.mv:first-child{border-top:0}
.mv-d{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.mv-n{min-width:0}.mv-n small{display:block;color:var(--muted);font-size:.78rem}
.mv-q{white-space:nowrap;font-weight:600}.mv-c{white-space:nowrap;color:var(--muted);font-size:.85rem;text-align:right}
.bloc-in .mv{grid-template-columns:1fr auto}
.essai{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;grid-template-columns:4.6rem 1fr auto;color:var(--ink)}
.essai:hover{background:var(--chip)}
.lien{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}.lien input{flex:1 1 8rem;min-width:0}
nav .tab .ct{display:none}
@media (max-width:760px){nav .tab .lg{display:none}nav .tab .ct{display:inline}nav button.tab{font-size:.78rem}}
table.couts tr.click{cursor:pointer}table.couts tr.click:hover td{background:var(--chip)}
table.couts td.n svg{vertical-align:-1px}
.recap{border:1px solid var(--line);border-radius:8px;padding:.3rem .8rem;background:var(--bg)}
.recap .mv{grid-template-columns:1fr auto}
.mv-c.st-crit,.mv-q.st-crit,.sub.st-crit{color:var(--crit)}.mv-c.st-ok,.mv-q.st-ok{color:var(--good)}
.viz{--s1:#2a78d6;--s2:#eb6834;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.8rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .viz{--s1:#3987e5;--s2:#d95926}}
:root[data-theme="dark"] .viz{--s1:#3987e5;--s2:#d95926}
.viz .b1{fill:var(--s1)}.viz .b2{fill:var(--s2)}.viz .gl{stroke:var(--line);stroke-width:1}.viz .base{stroke:var(--muted);stroke-width:1}
.viz .ax{fill:var(--muted);font-size:11px;font-family:Barlow,sans-serif}
.lgd{display:flex;gap:1rem;font-size:.85rem;margin-bottom:.3rem}.lgd i{display:inline-block;width:.75rem;height:.75rem;border-radius:2px;margin-right:.35rem;vertical-align:-1px;background:var(--s1)}.lgd i.b2{background:var(--s2)}
.viz path:hover{opacity:.8}
.pw{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:.5rem;margin-top:.3rem}
.pw label{font-weight:600;color:var(--ink)}.pw small{color:var(--muted);font-weight:400;font-size:.72rem}
.pts{display:inline-flex;gap:3px}.pts i{width:9px;height:9px;border-radius:50%;background:var(--track);display:inline-block}.pts i.on{background:var(--ink)}
.fil-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin:1.25rem 0}
.fil{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.fil dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem .8rem;margin:0;font-size:.9rem}.fil dt{color:var(--muted);font-weight:600}.fil dd{margin:0}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;font-size:.88rem}.pm ul{margin:.3rem 0 0;padding-left:1.1rem}.pm li{margin-bottom:.2rem}
@media (max-width:520px){.pm{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Sections">
    <div class="brand">Atelier</div>
    <button class="tab" data-view="accueil">Accueil</button>
    <button class="tab" data-view="projets">Projets</button>
    <button class="tab" data-view="leurres">Leurres</button>
    <button class="tab" data-view="stock">Stock</button>
    <button class="tab" data-view="ventes">Ventes</button>
    <button class="tab" data-view="refs"><span class="lg">Références</span><span class="ct">Réf.</span></button>
    <div class="sync" id="sync"><b></b><span>Connexion…</span></div>
  </nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<dialog id="viewer"><div class="dlg" id="viewerBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="especes.js"></script>
<script src="filaments.js"></script>
<script>
/* ---------- Données ---------- */
const COLS=["projets","articles","leurres","refs","fabrications","photos","mouvements","essais","reglages","ventes"];

/* Synchro Firebase (Firestore), privée par utilisateur */
let F=null, unsubs=[];
function cloudStore(uidv){
  const col=c=>F.collection(F.db,"users",uidv,c);
  return{
    listen(c,cb,err){const q=c==="mouvements"&&F.query?F.query(col(c),F.orderBy("date","desc"),F.limit(1500)):col(c);return F.onSnapshot(q,s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),err)},
    async batch(ops){const b=F.writeBatch(F.db);const J=x=>JSON.parse(JSON.stringify(x));ops.forEach(o=>{const r=this.ref(o.c,o.id);if(o.op==="inc")b.update(r,{qte:F.increment(o.d)});else if(o.op==="set")b.set(r,J(o.data));else if(o.op==="upd")b.update(r,J(o.f));else if(o.op==="del")b.delete(r)});await b.commit()},
    ref:(c,id)=>F.doc(F.db,"users",uidv,c,id),
    async save(c,o){const {id,...b}=o;await F.setDoc(this.ref(c,id),JSON.parse(JSON.stringify(b)))},
    async update(c,id,f){await F.updateDoc(this.ref(c,id),JSON.parse(JSON.stringify(f)))},
    async inc(c,id,d){await F.updateDoc(this.ref(c,id),{qte:F.increment(d)})},
    async batchInc(c,list){const b=F.writeBatch(F.db);list.forEach(([id,d])=>b.update(this.ref(c,id),{qte:F.increment(d)}));await b.commit()},
    async fabriquer(deltas,fab){const b=F.writeBatch(F.db);deltas.forEach(([id,d])=>b.update(this.ref("articles",id),{qte:F.increment(d)}));const {id,...data}=fab;b.set(this.ref("fabrications",id),JSON.parse(JSON.stringify(data)));await b.commit()},
    async annulerFab(deltas,fabId){const b=F.writeBatch(F.db);deltas.forEach(([id,d])=>b.update(this.ref("articles",id),{qte:F.increment(d)}));b.delete(this.ref("fabrications",fabId));await b.commit()},
    async addMedia(c,id,m){await F.updateDoc(this.ref(c,id),{medias:F.arrayUnion(m)})},
    async removeMedia(c,id,m){await F.updateDoc(this.ref(c,id),{medias:F.arrayRemove(m)})},
    async remove(c,id){await F.deleteDoc(this.ref(c,id))}
  };
}
function setSync(state,txt){const el=$("#sync");el.className="sync "+state;el.querySelector("span").textContent=txt;
  const m=$("#mobSync");if(m)m.textContent=txt}
function majReseau(){navigator.onLine?setSync("on","Synchronisé"):setSync("off","Pas de réseau")}
addEventListener("online",majReseau);addEventListener("offline",majReseau);

function boot(f){
  F=f;
  if(!F||!F.ok){view=F&&F.err?"erreur":"config";render();return}
  F.onAuthStateChanged(F.auth,u=>{
    unsubs.forEach(x=>x());unsubs=[];
    if(!u){view="login";COLS.forEach(c=>S[c]=[]);render();return}
    if(["login","chargement"].includes(view))view="accueil";
    store=cloudStore(u.uid);majReseau();
    COLS.forEach(c=>unsubs.push(store.listen(c,rows=>{S[c]=rows;render()},e=>setSync("off","Erreur de synchro ("+e.code+")"))));
    render();
  });
}
function init(){view="chargement";render();
  const go=()=>{boot(window.FB);OD.init(window.MS_CLIENT_ID)};
  if(window.FB)go();else addEventListener("fb-ready",go,{once:true});
  setTimeout(()=>{if(!F){view="erreur";render()}},12000);
}

  const d=REG().dernierExport,j=d?Math.floor((Date.now()-new Date(d))/864e5):null;

/* ---------- Calculs ---------- */
const CATCFG={
  "Filament":{unites:["g"],lot:1000,lotNom:"bobine",lotsNom:"bobines",fem:1},
  "Résine":{unites:["ml","g"],lot:1000,lotNom:"kit",lotsNom:"kits"},
  "Quincaillerie":{unites:["pcs","cm","m","g"],lot:10,lotNom:"sachet",lotsNom:"sachets"},
  "Hameçons":{unites:["pcs"],lot:10,lotNom:"sachet",lotsNom:"sachets"},
  "Peinture":{unites:["ml","g"],lot:30,lotNom:"flacon",lotsNom:"flacons"},
  "Bavettes":{unites:["pcs","cm²"],lot:1,lotNom:"plaque",lotsNom:"plaques",fem:1},
  "Outillage":{unites:["pcs"],lot:1,lotNom:"pièce",lotsNom:"pièces",fem:1},
  "Autre":{unites:["pcs","g","ml","cm","m"],lot:1,lotNom:"lot",lotsNom:"lots"}
};
const CATS=Object.keys(CATCFG);
const FIL=window.FILAMENTS_DATA||[];const filById=m=>FIL.find(f=>f.id===m);
const FILAMENTS=FIL.length?FIL.map(f=>f.id):["PLA","PETG","ABS","ASA","TPU"];
const MATIERES_CORPS=["ASA","PETG","PLA","ABS","PC","TPU","PA-CF","Résine","Bois","Autre"];
const cfg=a=>CATCFG[a?.categorie]||CATCFG.Autre;
const fmt=(n,d=2)=>(Number(n)||0).toLocaleString("fr-FR",{maximumFractionDigits:d});
const art=id=>S.articles.find(a=>a.id===id);
const lotQ=a=>Number(a?.lotQte)>0?Number(a.lotQte):cfg(a).lot;
const pu=a=>!a?0:(Number(a.prixLot)>0&&lotQ(a)>0?Number(a.prixLot)/lotQ(a):(Number(a.prix)||0));
const nomArt=a=>a?(a.nom||[a.matiere,a.couleur].filter(Boolean).join(" ")||"Sans nom"):"Article supprimé";
const enLots=a=>{const n=(Number(a.qte)||0)/lotQ(a),c=cfg(a);return fmt(n)+" "+(n>1?c.lotsNom:c.lotNom)};
const coutMat=l=>(l.bom||[]).reduce((s,b)=>s+pu(art(b.articleId))*pnum(b.qte),0);
const matiereImp=l=>{const b=(l.bom||[]).map(x=>art(x.articleId)).find(a=>a?.categorie==="Filament");return b?.matiere||(FILAMENTS.includes(l.corps)?l.corps:"")};
const wattsMat=m=>{const r=REG();return Number(r.wattsMat?.[m])||filById(m)?.watts||r.watts};
const coutImp=l=>{const h=pnum(l.impH),r=REG();if(!(h>0))return 0;return h*(wattsMat(matiereImp(l))/1000)*r.kwh+h*r.usure};
const coutMO=l=>pnum(l.moH)*(REG().tauxHoraire??0);
const coutEmb=()=>REG().emballage??0;
const coutLeurre=l=>coutMat(l)+coutImp(l)+coutMO(l)+coutEmb();
const CANAUX_DEF=[{nom:"Main propre",pct:0,fixe:0},{nom:"Leboncoin",pct:0,fixe:0},{nom:"Vinted",pct:0,fixe:0},{nom:"Etsy",pct:0,fixe:0},{nom:"Site perso",pct:0,fixe:0},{nom:"Salon / marché",pct:0,fixe:0}];
const canaux=()=>REG().canaux?.length?REG().canaux:DEF_REG.canaux;
const canal=n=>canaux().find(c=>c.nom===n)||{nom:n,pct:0,fixe:0};
function couts(l,canalNom){
  const r=REG(),mat=coutMat(l),imp=coutImp(l),mo=coutMO(l),emb=coutEmb(),total=mat+imp+mo+emb;
  const urs=(r.urssaf??0)/100,mv=(r.margeVisee??30)/100,c=canal(canalNom||"Main propre");
  const pv=Number(l.prixVente)||0;
  const frais=p=>p*(c.pct/100)+c.fixe+p*urs;
  const margeMP=pv?pv-frais(pv)-total:0;
  const den=1-c.pct/100-urs-mv,conseille=den>0?(total+c.fixe)/den:0;
  return{mat,imp,mo,emb,total,margeMP,tauxMP:pv?margeMP/pv*100:0,conseille:Math.ceil(conseille*2)/2,frais:pv?frais(pv):0}
}

const venduTot=id=>S.ventes.filter(v=>v.leurreId===id).reduce((s,v)=>s+(Number(v.qte)||0),0);
const dispo=id=>fabTot(id)-venduTot(id);
const coutUnitFab=l=>coutLeurre(l);

const fabricables=l=>{const r=(l.bom||[]).filter(b=>Number(b.qte)>0).map(b=>Math.floor((Number(art(b.articleId)?.qte)||0)/Number(b.qte)));return r.length?Math.min(...r):0};

let stockVue="liste",stockQ="",stockOnglet="articles",jrnMotif="tous";
const niveau=a=>{const q=Number(a.qte)||0,sl=Number(a.seuil)||0;
  if(q<=0)return{k:"crit",t:"Épuisé"};if(sl>0&&q<=sl)return{k:"crit",t:"À racheter"};if(sl>0&&q<=sl*1.5)return{k:"warn",t:"Bientôt bas"};return{k:"ok",t:"OK"}};
const ICO_NIV={ok:'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  warn:'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1 11 11H1Z" fill="currentColor"/></svg>',
  crit:'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="10" height="10" rx="1" fill="currentColor"/></svg>'};
function jauge(a){
  const q=Number(a.qte)||0,sl=Number(a.seuil)||0,L=lotQ(a),max=Math.max(q,sl*2.5,L,1),n=niveau(a);
  const pq=Math.min(100,q/max*100),ps=Math.min(100,sl/max*100);
  return`<div class="jg" title="${esc(nomArt(a))} : ${fmt(q)} ${esc(a.unite)}${sl?", seuil "+fmt(sl)+" "+esc(a.unite):""}">
    <div class="jg-h"><span class="jg-n">${dot(a)}${esc(nomArt(a))}</span><span class="num">${fmt(q)} ${esc(a.unite)}</span></div>
    <div class="jg-t"><i class="s-${n.k}" style="width:${pq}%"></i>${sl?`<b style="left:${ps}%" aria-hidden="true"></b>`:""}</div>
    <div class="jg-f st-${n.k}">${ICO_NIV[n.k]} ${n.t}${sl?`<span class="sub">seuil ${fmt(sl)} ${esc(a.unite)}</span>`:""}</div></div>`;
}
function bobine(a){
  const q=Number(a.qte)||0,L=lotQ(a),pleines=Math.floor(q/L),reste=(q%L)/L,n=niveau(a),col=a.teinte||"#9aa5b1";
  const pct=pleines>0&&reste===0?100:Math.round(reste*100);
  return`<button type="button" class="bob" onclick="editArticle('${a.id}')" title="${esc(nomArt(a))} : ${fmt(q)} g">
    <span class="bob-r" style="--c:${esc(col)};--p:${pct}%"><span class="bob-in">${fmt(q/L,q/L<10?2:1)}<small>${q/L>1?"bobines":"bobine"}</small></span></span>
    <span class="bob-n">${esc(nomArt(a))}</span><span class="bob-q num">${fmt(q)} g</span><span class="st-${n.k} bob-s">${ICO_NIV[n.k]} ${n.t}</span></button>`;
}
function panneauStock(l){
  const fil=l.filter(a=>a.categorie==="Filament"),autres=l.filter(a=>a.categorie!=="Filament");
  const parCat=CATS.map(c=>({c,v:S.articles.filter(a=>a.categorie===c).reduce((s,a)=>s+(Number(a.qte)||0)*pu(a),0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const vmax=Math.max(...parCat.map(x=>x.v),1),tot=parCat.reduce((s,x)=>s+x.v,0);
  const crit=S.articles.filter(a=>niveau(a).k==="crit").length,warn=S.articles.filter(a=>niveau(a).k==="warn").length;
  return`<div class="pan">
  <div class="pan-kpi"><div><strong class="num">${eur(tot)}</strong><span>valeur du stock</span></div><div class="st-crit"><strong>${crit}</strong><span>${ICO_NIV.crit} à racheter</span></div><div class="st-warn"><strong>${warn}</strong><span>${ICO_NIV.warn} bientôt bas</span></div></div>
  ${fil.length?`<section><h3>Bobines de filament</h3><p class="sub" style="margin:.1rem 0 .6rem">Au centre : le nombre de bobines. L'anneau, à la couleur du filament : ce qui reste de la bobine entamée.</p><div class="bobs">${fil.map(bobine).join("")}</div></section>`:""}
  ${autres.length?`<section><h3>Niveaux</h3><p class="sub" style="margin:.1rem 0 .6rem">Le trait vertical marque le seuil d'alerte.</p>${autres.map(jauge).join("")}</section>`:""}
  ${parCat.length>1?`<section><h3>Valeur par catégorie</h3>${parCat.map(x=>`<div class="vc" title="${esc(x.c)} : ${eur(x.v)}"><span>${esc(x.c)}</span><div class="vc-t"><i style="width:${Math.max(2,x.v/vmax*100)}%"></i></div><span class="num">${eur(x.v)}</span></div>`).join("")}</section>`:""}
  </div>`;
}
function vStock(){
  if(stockOnglet==="journal")return vJournal();if(stockOnglet==="courses")return vCourses();
  const q=stockQ.trim().toLowerCase();
  const l=S.articles.filter(a=>(filtre==="tous"||a.categorie===filtre)&&(!q||(nomArt(a)+" "+(a.fournisseur||"")+" "+a.categorie).toLowerCase().includes(q))).sort((a,b)=>(CATS.indexOf(a.categorie)-CATS.indexOf(b.categorie))||nomArt(a).localeCompare(nomArt(b)));

const suggestion=a=>{const L=lotQ(a),sl=Number(a.seuil)||0,q=Number(a.qte)||0;return Math.max(1,Math.ceil((Math.max(sl*2,sl+L)-q)/L))};

async function annulerFab(id){
  const f=S.fabrications.find(x=>x.id===id);if(!f)return;
  if(!confirm(`Annuler la fabrication de ${f.n} × ${f.nom} ? Les composants seront remis en stock.`))return;
  const ops=(f.conso||[]).filter(c=>art(c.articleId)).map(c=>({op:"inc",c:"articles",id:c.articleId,d:Number(c.qte)||0}));
  (f.mvtIds||[]).forEach(m=>ops.push({op:"del",c:"mouvements",id:m}));ops.push({op:"del",c:"fabrications",id});
  try{await store.batch(ops);toast("Fabrication annulée, stock remis")}catch(e){toast("Échec ("+(e.code||"erreur")+")")}
}

const dernierAppui={};
const MOTIFS={achat:"Achat",sortie:"Sortie",fabrication:"Fabrication",annulation:"Annulation",correction:"Correction",initial:"Stock initial",perte:"Perte / casse"};
function mvt(a,delta,motif,x={}){return{op:"set",c:"mouvements",id:uid(),data:{date:new Date().toISOString(),articleId:a.id,nom:nomArt(a),categorie:a.categorie||"",delta:Math.round(delta*1000)/1000,unite:a.unite||"",motif,cout:x.cout??null,projetId:x.projetId||"",ref:x.ref||""}}}
async function lancer(ops,ok,undoOps){try{await store.batch(ops);toast(ok,undoOps?{label:"Annuler",fn:()=>store.batch(undoOps).then(()=>toast("Annulé")).catch(e=>toast("Échec : "+(e.code||"erreur")))}:undefined)}catch(e){toast("Échec : "+(e.code||"erreur"))}}
function bouger(id,sens){if(stockVerrou){toast("Déverrouille d'abord avec le cadenas");return}const a=art(id);if(!a)return;
  const t=Date.now();if(t-(dernierAppui[id]||0)<800)return;dernierAppui[id]=t;
  const L=lotQ(a),q=Number(a.qte)||0;
  let d=sens*L;if(sens<0){if(q<=0){toast("Stock déjà à zéro");return}if(q<L)d=-q}
  const m=mvt(a,d,d>0?"achat":"sortie",{cout:d>0&&Number(a.prixLot)>0?Number(a.prixLot):null});
  lancer([{op:"inc",c:"articles",id,d},m],(d>0?"+ ":"− ")+fmt(Math.abs(d))+" "+a.unite+" "+nomArt(a),[{op:"inc",c:"articles",id,d:-d},{op:"del",c:"mouvements",id:m.id}]);
}

function wire(c,id,build){
  const orig0=id?JSON.parse(JSON.stringify(S[c].find(x=>x.id===id)||{})):null;
  $("#ok").onclick=async()=>{const o=build();if(!o)return;dlg.close();
    if(c==="articles"){const avant=id?Number(orig0.qte)||0:0,apres=Number(o.qte)||0;
      if(apres!==avant){const m=mvt({...o},apres-avant,id?"correction":"initial");
        try{await store.batch([{op:"set",c,id:o.id,data:id?{...orig0,...o,id:undefined}:{...o,medias:[],id:undefined}},m]);toast("Enregistré");}catch(e){toast("Échec de l'enregistrement : "+(e.code||"erreur"))}return}}
    if(!id){await save(c,{...o,medias:[]});toast("Enregistré");return}
    const diff={};Object.keys(o).forEach(k=>{if(k!=="id"&&JSON.stringify(o[k])!==JSON.stringify(orig0[k]))diff[k]=o[k]});
    if(Object.keys(diff).length){await upd(c,id,diff);toast("Enregistré")}else toast("Aucune modification")};
  if(id)$("#del").onclick=async()=>{
    let msg="Supprimer définitivement ? Cette action est irréversible.";
    if(c==="articles"){const us=S.leurres.filter(l=>(l.bom||[]).some(b=>b.articleId===id));if(us.length)msg=`Cet article est utilisé dans ${us.length} fiche${us.length>1?"s":""} leurre (${us.map(l=>l.nom).join(", ")}). Le supprimer cassera leur nomenclature et leur coût. Supprimer quand même ?`}
    if(confirm(msg)){dlg.close();await remove(c,id);toast("Supprimé")}};
}

function blocAchat(a){const c=cfg(a);return`<details class="bloc"><summary>Enregistrer un achat</summary>
  <div class="grid2" style="margin-top:.6rem"><label>Nombre de ${c.lotsNom}<input id="ac_n" type="text" inputmode="decimal" value="1" oninput="$('#ac_p').placeholder=vIn((pnum(this.value)*(Number(art('${a.id}')?.prixLot)||0)).toFixed(2))"></label>

  let msg=`Lu dans le G-code : ${g?fmt(g,1)+" g de filament":""}${g&&h?", ":""}${h?fmt(h)+" h d'impression":""}.`;
  if(g){if(fils.length===1){fils[0].b.qte=g;msg+=" Poids reporté sur la ligne filament."}

}

function calcVente(){const q=Math.max(1,Math.round(num("v_q")||1)),p=num("v_p"),c=canal(val("v_c")),tot=q*p;

function majVente(leurreChange,canalChange){

    <div class="mv"><span class="mv-n"><b>Marge</b></span><span class="mv-c num ${marge<0?"st-crit":"st-ok"}"><b>${eur(marge)}</b></span></div>`:`<p class="sub">Choisis un leurre pour voir la marge.</p>`;

function vBilan(){
  const an=new Date().getFullYear(),V=S.ventes,Va=V.filter(v=>(v.date||"").startsWith(String(an)));
  const CA=Va.reduce((s,v)=>s+ca(v),0),M=Va.reduce((s,v)=>s+margeV(v),0),N=Va.reduce((s,v)=>s+(Number(v.qte)||0),0),C=Va.reduce((s,v)=>s+(Number(v.cotis)||0),0);
  const enc=V.filter(v=>!v.payee).reduce((s,v)=>s+ca(v),0);
  const mois=[];const d0=new Date();for(let i=11;i>=0;i--){const d=new Date(d0.getFullYear(),d0.getMonth()-i,1);mois.push({k:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),l:d.toLocaleDateString("fr-FR",{month:"short"}).replace(".","")})}
  mois.forEach(m=>{const vs=V.filter(v=>(v.date||"").startsWith(m.k));m.ca=vs.reduce((s,v)=>s+ca(v),0);m.mg=vs.reduce((s,v)=>s+margeV(v),0)});
  const parM={};V.forEach(v=>{const k=v.leurreId||v.nom;parM[k]=parM[k]||{nom:v.nom+" "+(v.version||""),q:0,ca:0,mg:0};parM[k].q+=Number(v.qte)||0;parM[k].ca+=ca(v);parM[k].mg+=margeV(v)});
  const parC={};V.forEach(v=>{parC[v.canal]=parC[v.canal]||{q:0,ca:0,mg:0};parC[v.canal].q+=Number(v.qte)||0;parC[v.canal].ca+=ca(v);parC[v.canal].mg+=margeV(v)});
  if(!V.length)return`<div class="list" style="margin-top:.75rem"><div class="empty">Le bilan apparaîtra dès ta première vente.</div></div>`;
  return`<div class="kpis" style="margin-top:.75rem"><div class="kpi"><strong class="num">${eur(CA)}</strong><span>chiffre d'affaires ${an}</span></div><div class="kpi ${M<0?"warn":""}"><strong class="num">${eur(M)}</strong><span>marge nette ${an}</span></div><div class="kpi"><strong>${N}</strong><span>leurres vendus en ${an}</span></div><div class="kpi ${enc?"warn":""}"><strong class="num">${eur(enc)}</strong><span>reste à encaisser</span></div></div>
  ${C?`<p class="sub">Cotisations estimées sur ${an} : ${eur(C)}, déjà déduites de la marge.</p>`:""}
  <section class="block"><h2>Chiffre d'affaires et marge, 12 derniers mois</h2>${graphe(mois)}</section>
  <section class="block"><h2>Par modèle</h2><div class="tw"><table class="ref"><thead><tr><th>Leurre</th><th>Vendus</th><th>Chiffre d'affaires</th><th>Marge</th><th>Marge %</th></tr></thead><tbody>${Object.values(parM).sort((a,b)=>b.ca-a.ca).map(x=>`<tr><td>${esc(x.nom)}</td><td class="n">${x.q}</td><td class="n">${eur(x.ca)}</td><td class="n">${eur(x.mg)}</td><td class="n">${x.ca?fmt(x.mg/x.ca*100,0)+" %":"—"}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="block"><h2>Par canal</h2><div class="tw"><table class="ref"><thead><tr><th>Canal</th><th>Vendus</th><th>Chiffre d'affaires</th><th>Marge</th></tr></thead><tbody>${Object.entries(parC).sort((a,b)=>b[1].ca-a[1].ca).map(([k,x])=>`<tr><td>${esc(k)}</td><td class="n">${x.q}</td><td class="n">${eur(x.ca)}</td><td class="n">${eur(x.mg)}</td></tr>`).join("")}</tbody></table></div></section>`;
}
function graphe(m){
  const W=640,H=220,pl=46,pb=26,pt=10,iw=W-pl-8,ih=H-pb-pt;
  const max=Math.max(...m.map(x=>Math.max(x.ca,x.mg)),1),min=Math.min(0,...m.map(x=>x.mg));
  const pas=[1,2,5,10,20,50,100,200,500,1000,2000,5000].find(p=>(max-min)/p<=5)||10000,top=Math.ceil(max/pas)*pas,bot=Math.floor(min/pas)*pas;
  const y=v=>pt+ih-(v-bot)/(top-bot||1)*ih,gw=iw/m.length,bw=Math.min(16,gw/2-3);
  let g="";for(let v=bot;v<=top;v+=pas)g+=`<line x1="${pl}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v.toLocaleString("fr-FR")} €</text>`;
  const bar=(x,v,cls,lbl)=>{const y0=y(0),y1=y(v),h=Math.abs(y1-y0);if(!v)return"";const yy=Math.min(y0,y1),r=Math.min(4,h);
    const d=v>0?`M${x},${y0}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${y0}Z`:`M${x},${y0}V${yy+h-r}Q${x},${yy+h} ${x+r},${yy+h}H${x+bw-r}Q${x+bw},${yy+h} ${x+bw},${yy+h-r}V${y0}Z`;
    return`<path d="${d}" class="${cls}"><title>${lbl}</title></path>`};
  const bars=m.map((x,i)=>{const cx=pl+gw*i+gw/2;return bar(cx-bw-1,x.ca,"b1",`${x.l} : chiffre d'affaires ${eur(x.ca)}`)+bar(cx+1,x.mg,"b2",`${x.l} : marge ${eur(x.mg)}`)+`<text x="${cx}" y="${H-8}" text-anchor="middle" class="ax">${x.l}</text>`}).join("");
  return`<div class="viz"><div class="lgd"><span><i class="b1"></i>Chiffre d'affaires</span><span><i class="b2"></i>Marge nette</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d'affaires et marge par mois sur 12 mois" style="width:100%;height:auto">${g}<line x1="${pl}" x2="${W-8}" y1="${y(0)}" y2="${y(0)}" class="base"/>${bars}</svg>
  <details><summary class="sub">Voir les valeurs</summary><div class="tw"><table class="ref"><thead><tr><th>Mois</th><th>Chiffre d'affaires</th><th>Marge</th></tr></thead><tbody>${m.map(x=>`<tr><td>${x.l}</td><td class="n">${eur(x.ca)}</td><td class="n">${eur(x.mg)}</td></tr>`).join("")}</tbody></table></div></details></div>`;
}

const PH={};
function photoCache(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("ph:"+k));localStorage.setItem("ph:"+k,JSON.stringify(v))}catch(e){return null}}
async function photoEsp(sci,wiki){
  if(PH[sci]!==undefined)return PH[sci];
  const c=photoCache(sci);if(c&&c.u&&c.t>Date.now()-30*864e5)return PH[sci]=c.u;
  const json=async u=>{try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}};
  const rest=async (dom,t)=>{const j=await json(`https://${dom}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g,"_"))}`);return j?.thumbnail?.source||""};
  const api=async (dom,t)=>{const j=await json(`https://${dom}.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=480&redirects=1&format=json&origin=*&titles=${encodeURIComponent(t)}`);const pg=j&&Object.values(j.query?.pages||{})[0];return pg?.thumbnail?.source||""};
  PH[sci]=(async()=>{
    let u=await rest("en",sci);
    if(!u&&wiki)u=await rest("fr",wiki.replace(/_/g," "));
    if(!u)u=await api("en",sci);
    if(!u&&wiki)u=await api("fr",wiki.replace(/_/g," "));
    if(u)photoCache(sci,{u,t:Date.now()});
    PH[sci]=u||undefined;return u;
  })();
  return PH[sci];
}
const photoPerso=id=>S.photos.find(p=>p.id===id)?.url||"";
function chargerPhotos(){
  document.querySelectorAll(".ph[data-sci]:not([data-ok])").forEach(async el=>{
    el.setAttribute("data-ok","1");
    const perso=photoPerso(el.dataset.id);
    const u=perso||await photoEsp(el.dataset.sci,el.dataset.wiki);
    if(!el.isConnected)return;
    if(!u){el.textContent=el.dataset.nom+" (photo indisponible)";return}
    const img=new Image();img.alt=el.dataset.nom||"";img.decoding="async";
    img.onload=()=>{el.textContent="";el.appendChild(img)};
    img.onerror=()=>{el.textContent=el.dataset.nom+" (photo indisponible)"};
    img.src=u;
  });
}

function drawGrid(){
  const g=$("#grid"),n=tmpRef.colonnes.length;

  <tbody>${tmpRef.lignes.map((l,r)=>`<tr>${Array.from({length:n},(_,i)=>`<td><input value="${esc(l[i]??"")}" oninput="tmpRef.lignes[${r}][${i}]=this.value" aria-label="Ligne ${r+1}, ${esc(tmpRef.colonnes[i])}"></td>`).join("")}<td><button type="button" class="x" aria-label="Supprimer la ligne ${r+1}" onclick="gridOp('row-',${r})">×</button></td></tr>`).join("")}</tbody></table>`;
}
function gridOp(op,i){
  const t=tmpRef;
  if(op==="row+"){t.lignes.push(Array(t.colonnes.length).fill(""));drawGrid();const ins=$("#grid tbody tr:last-child input");ins&&ins.focus();return}
  if(op==="row-")t.lignes.splice(i,1);
  if(op==="col+"){t.colonnes.push("Colonne "+(t.colonnes.length+1));t.lignes.forEach(l=>l.push(""))}
  if(op==="col-"&&t.colonnes.length>1){t.colonnes.pop();t.lignes.forEach(l=>l.length=t.colonnes.length)}
  drawGrid();
}

/* ---------- OneDrive : photos et vidéos ---------- */
const nbMed=o=>{const n=(o.medias||[]).length;return n?" · "+n+" média"+(n>1?"s":""):""};
const OD={
  pca:null, scopes:["Files.ReadWrite.AppFolder"], cache:{},
  async init(clientId){
    if(!clientId||!window.msal)return;
    this.pca=new msal.PublicClientApplication({auth:{clientId,authority:"https://login.microsoftonline.com/consumers",redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
    try{await this.pca.initialize();await this.pca.handleRedirectPromise()}catch(e){toast("Connexion OneDrive : "+(e.errorCode||e.message))}
    render();
  },
  compte(){return this.pca?this.pca.getAllAccounts()[0]:null},
  connecter(){if(!this.pca){toast("OneDrive non configuré (voir LISEZMOI)");return}this.pca.loginRedirect({scopes:this.scopes})},
  async token(){const account=this.compte();if(!account){this.connecter();throw new Error("non connecté")}
    try{return (await this.pca.acquireTokenSilent({scopes:this.scopes,account})).accessToken}
    catch(e){await this.pca.acquireTokenRedirect({scopes:this.scopes,account});throw e}},
  async api(path,opt={}){const t=await this.token();
    const r=await fetch("https://graph.microsoft.com/v1.0"+path,{...opt,headers:{Authorization:"Bearer "+t,...(opt.headers||{})}});
    if(!r.ok)throw new Error("OneDrive "+r.status);return r.status===204?null:r.json()},
  chemin:p=>p.split("/").map(encodeURIComponent).join("/"),
  async envoyer(fichier,nom,dossier,onProg){
    const p=this.chemin(dossier+"/"+nom);
    if(fichier.size<4e6){onProg(.3);const it=await this.api("/me/drive/special/approot:/"+p+":/content",{method:"PUT",body:fichier});onProg(1);return it}
    const sess=await this.api("/me/drive/special/approot:/"+p+":/createUploadSession",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({item:{"@microsoft.graph.conflictBehavior":"rename"}})});
    const CH=32*327680;let it=null;   // morceaux de 10 Mo
    for(let o=0;o<fichier.size;o+=CH){const fin=Math.min(o+CH,fichier.size);
      const r=await fetch(sess.uploadUrl,{method:"PUT",headers:{"Content-Range":`bytes ${o}-${fin-1}/${fichier.size}`},body:fichier.slice(o,fin)});
      if(!r.ok)throw new Error("envoi interrompu ("+r.status+")");
      onProg(fin/fichier.size);if(r.status===200||r.status===201)it=await r.json()}
    return it},
  async vignette(id){if(this.cache["t"+id]!==undefined)return this.cache["t"+id];
    const r=await this.api("/me/drive/items/"+id+"/thumbnails");return this.cache["t"+id]=r.value?.[0]?.medium?.url||""},
  async item(id){return await this.api("/me/drive/items/"+id)}
};
async function compresser(f){
  if(!f.type.startsWith("image/")||f.type==="image/gif")return f;
  try{const bmp=await createImageBitmap(f);const k=Math.min(1,2048/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));return b&&b.size<f.size?b:f}catch(e){return f}
}
const mediaBlock=()=>OD.pca?`<div><h3 style="margin-bottom:.4rem">Photos et vidéos</h3><div id="medias"></div></div>`:"";
function drawMedia(c,id){

  if(!OD.compte()){box.innerHTML=`<button class="btn ghost sm" onclick="OD.connecter()">Connecter OneDrive</button>`;return}
  const ms=(S[c].find(x=>x.id===id)||{}).medias||[];
  box.innerHTML=`<div class="gal">${ms.map((m,i)=>`<button type="button" onclick="voirMedia('${c}','${id}',${i})" aria-label="Ouvrir ${esc(m.nom)}"><span class="ph" data-tid="${esc(m.id)}">${esc(m.nom)}</span>${m.video?`<span class="vid">vidéo</span>`:""}</button>`).join("")}</div>
  <div id="envoi" style="margin:.5rem 0"></div>
  <label class="btn ghost sm" style="display:inline-block;color:var(--ink);cursor:pointer">Ajouter des photos ou vidéos<input type="file" accept="image/*,video/*" multiple hidden onchange="ajouterMedias('${c}','${id}',this.files)"></label>`;
  ms.forEach(m=>OD.vignette(m.id).then(u=>{const el=box.querySelector(`[data-tid="${CSS.escape(m.id)}"]`);if(u&&el)el.outerHTML=`<img src="${esc(u)}" alt="${esc(m.nom)}" loading="lazy">`}).catch(()=>{}));
}
async function ajouterMedias(c,id,files){
  const zone=$("#envoi");
  for(const f0 of [...files]){
    zone.innerHTML=`<div class="sub">Envoi de ${esc(f0.name)}…</div><div class="prog"><i id="pr"></i></div>`;
    try{const f=await compresser(f0),video=f0.type.startsWith("video/");
      let nom=Date.now()+"-"+f0.name.replace(/[^\w.\-]+/g,"_");if(f!==f0)nom=nom.replace(/\.\w+$/,"")+".jpg";
      const it=await OD.envoyer(f,nom,c+"/"+id,p=>{const b=$("#pr");if(b)b.style.width=Math.round(p*100)+"%"});
      await store.addMedia(c,id,{id:it.id,nom:f0.name,video,taille:it.size||f.size,date:new Date().toISOString()});
    }catch(e){toast("Échec de l'envoi de "+f0.name+" : "+e.message)}
  }
  zone.innerHTML="";setTimeout(()=>drawMedia(c,id),400);
}
const viewer=$("#viewer");
async function voirMedia(c,id,i){
  const m=((S[c].find(x=>x.id===id)||{}).medias||[])[i];if(!m)return;
  const vb=$("#viewerBody");vb.innerHTML=`<p class="sub">Chargement…</p>`;viewer.showModal();

    $("#vdel").onclick=async()=>{if(!confirm("Supprimer ce média ? Il ira dans la corbeille OneDrive."))return;

      await store.removeMedia(c,id,m);viewer.close();toast("Média supprimé");setTimeout(()=>drawMedia(c,id),400)};
  }catch(e){vb.innerHTML=`<p>Impossible d'ouvrir ce média : ${esc(e.message)}</p><div class="actions"><button class="btn" onclick="viewer.close()">Fermer</button></div>`}
}
